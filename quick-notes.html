<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>随手记 · Quick Notes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随手记">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f4f1ea;
    --paper: #fbfaf6;
    --ink: #2b2722;
    --ink-soft: #6b645a;
    --line: #e3ddd0;
    --accent: #c8553d;
    --accent-soft: #f0d9d2;
    --todo-soft: #d2e9f5;
    --done: #a9a294;
    --shadow: rgba(43, 39, 34, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    background-image: radial-gradient(var(--line) 0.5px, transparent 0.5px);
    background-size: 22px 22px;
    transition: background-color 0.3s;
  }

  #app-wrap {
    transform-origin: 0 0;
    will-change: transform;
    min-height: 100vh;
  }

  /* ===== 可选背景 ===== */
  body[data-bg="paper"] { /* 默认米黄圆点，同上 */ }
  body[data-bg="plain"] {
    --bg: #fbfaf6;
    background-image: none;
  }
  body[data-bg="gray"] {
    --bg: #eceae6;
    background-image: none;
  }
  body[data-bg="pink"] {
    --bg: #f6ece8;
    background-image: linear-gradient(160deg, #f7e3dc 0%, #f1e4ea 100%);
    background-attachment: fixed;
  }
  body[data-bg="mint"] {
    --bg: #e8f0ea;
    background-image: linear-gradient(160deg, #e6f0ea 0%, #e4ecf1 100%);
    background-attachment: fixed;
  }
  body[data-bg="grid"] {
    --bg: #f4f1ea;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  body[data-bg="dark"] {
    --bg: #23201c;
    --paper: #2e2a25;
    --ink: #ece7df;
    --ink-soft: #a89f93;
    --line: #423d36;
    --accent-soft: #4a3530;
    --todo-soft: #1c3245;
    --shadow: rgba(0,0,0,0.3);
    background-image: radial-gradient(#34302a 0.5px, transparent 0.5px);
    background-size: 22px 22px;
  }
  body[data-bg="midnight"] {
    --bg: #1a1d2b;
    --paper: #242838;
    --ink: #e6e8f0;
    --ink-soft: #9aa0b8;
    --line: #363b50;
    --accent-soft: #3a3550;
    --todo-soft: #1d2a42;
    --shadow: rgba(0,0,0,0.35);
    background-image: linear-gradient(160deg, #1a1d2b 0%, #232036 100%);
    background-attachment: fixed;
  }

  /* ===== 自然主题背景（浅色系，文字用默认深色）===== */
  body[data-bg="sunrise"]  { background-image: linear-gradient(180deg,#ffd9a0,#ffb88c 45%,#ff9a8b); background-attachment: fixed; }
  body[data-bg="sunset"]   { background-image: linear-gradient(180deg,#f6b88a,#e98a7a 50%,#9b6b9e); background-attachment: fixed; }
  body[data-bg="ocean"]    { background-image: linear-gradient(180deg,#a8e0e6,#6fb6cf 55%,#4a8fb5); background-attachment: fixed; }
  body[data-bg="forest"]   { background-image: linear-gradient(180deg,#cfe8c0,#9ecb8a 55%,#6fa86b); background-attachment: fixed; }
  body[data-bg="sky"]      { background-image: linear-gradient(180deg,#bfe3f5,#dceefb 60%,#eef6fb); background-attachment: fixed; }
  body[data-bg="lavender"] { background-image: linear-gradient(160deg,#e7dcf3,#d4c5ec 50%,#bfa9dd); background-attachment: fixed; }
  body[data-bg="sakura"]   { background-image: linear-gradient(170deg,#fce4ec,#f8d0dd 50%,#f4b8cd); background-attachment: fixed; }
  body[data-bg="autumn"]   { background-image: linear-gradient(170deg,#f3d9a8,#e0a96d 50%,#c47a4a); background-attachment: fixed; }

  /* 深色系自然主题，文字提亮 */
  body[data-bg="aurora"] {
    --paper: rgba(255,255,255,0.92);
    --shadow: rgba(0,0,0,0.3);
    background-image: linear-gradient(180deg,#1a2a4a,#2a5a6a 45%,#3a8a7a 70%,#1a2a4a);
    background-attachment: fixed;
  }
  body[data-bg="dusk"] {
    --paper: rgba(255,255,255,0.93);
    --shadow: rgba(0,0,0,0.25);
    background-image: linear-gradient(180deg,#3a3a5a,#6a5a7a 55%,#b08a8a);
    background-attachment: fixed;
  }
  body[data-bg="custom"] {
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    --paper: rgba(255,255,255,0.92);
    --shadow: rgba(0,0,0,0.25);
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 10px;
    padding-bottom: var(--composer-h, 140px);
  }

  header {
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 0 14px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 80%, transparent);
    z-index: 10;
  }

  .titlebar {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    padding-left: 20px;
    padding-right: 10px;
  }

  .gear {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    width: 34px; height: 34px;
    border-radius: 10px;
    cursor: pointer;
    align-self: center;
    transition: all 0.2s;
  }
  .gear:hover { border-color: var(--accent); color: var(--accent); }

  .gear-menu {
    position: absolute;
    right: 0;
    top: 52px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 36px rgba(43,39,34,0.2);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 40;
    min-width: 210px;
    animation: rise 0.18s ease both;
  }
  .gear-menu.show { display: flex; }
  .gear-menu button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    text-align: left;
    padding: 10px 13px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .gear-menu button:hover { background: var(--accent-soft); }
  .gear-sep { height: 1px; background: var(--line); margin: 4px 8px; }
  .cloud-status {
    font-size: 0.68rem;
    color: var(--ink-soft);
    padding: 4px 13px 6px;
    line-height: 1.4;
  }
  .cloud-status.on { color: #4a6b48; }

  .cloud-label {
    display: block;
    font-size: 0.74rem;
    color: var(--ink-soft);
    font-weight: 500;
    margin: 13px 0 5px;
  }
  #cloud-url, #cloud-key, #cloud-room {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    outline: none;
    box-sizing: border-box;
  }
  #cloud-url:focus, #cloud-key:focus, #cloud-room:focus { border-color: var(--accent); }

  .title {
    font-family: 'Fraunces', serif;
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .title em { font-style: italic; color: var(--accent); }

  .sub {
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: none;
    background: var(--line);
    font-family: inherit;
    font-size: 0.93rem;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-add { font-size: 1.1rem; padding: 6px 12px; color: var(--accent); background: transparent; }
  .tab-edit-hint { font-size: 0.65rem; opacity: 0.7; margin-left: 1px; }
  .tab.dragging {
    background: var(--accent);
    color: #fff;
    transform: scale(1.08);
    box-shadow: 0 4px 14px rgba(200,85,61,0.4);
    opacity: 0.92;
  }
  .tabs { touch-action: pan-x; }
  .tabs .tab {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .tab-overdue { color: var(--accent); }
  .tab-overdue.active { background: var(--accent); color: #fff; }
  .tab-overdue .count { background: var(--accent); color:#fff; padding:0 6px; border-radius:10px; opacity:1; }
  .tab-overdue.active .count { background: rgba(255,255,255,0.25); }

  .cat-btn {
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    font-size: 0.68rem;
    color: var(--ink-soft);
    padding: 2px 9px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active {
    background: var(--ink);
    color: var(--paper);
  }
  .tab .count {
    font-size: 0.75rem;
    opacity: 0.75;
    margin-left: 3px;
  }

  .list { margin-top: 8px; }

  /* 搜索栏 */
  .search-bar {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 6px 4px 14px;
  }
  .search-bar.show { display: flex; }
  #search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    outline: none;
    padding: 7px 0;
  }
  #search-clear {
    border: none;
    background: var(--bg);
    color: var(--ink-soft);
    width: 28px; height: 28px;
    border-radius: 8px;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  mark {
    background: #ffe08a;
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }
  body[data-bg="dark"] mark, body[data-bg="midnight"] mark { background: #b8923a; color:#fff; }

  /* 类别分组 */
  .cat-group { margin-bottom: 6px; }
  .cat-group-head {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: none;
    background: var(--accent-soft);
    font-family: inherit;
    cursor: pointer;
    padding: 5px 14px 5px 11px;
    margin-top: 14px;
    border-radius: 20px;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .cg-arrow {
    font-size: 0.75rem;
    color: var(--accent);
    transition: transform 0.2s;
  }
  .cat-group-head.collapsed .cg-arrow { transform: rotate(-90deg); }
  .cg-name {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent);
  }
  .cg-count {
    font-size: 0.68rem;
    color: var(--accent);
    background: rgba(0,0,0,0.06);
    border: 1px solid var(--accent-soft);
    padding: 1px 7px;
    border-radius: 20px;
  }
  .cat-group-body { padding-top: 2px; }

  .item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 10px;
    margin-bottom: 11px;
    display: flex;
    gap: 9px;
    align-items: flex-start;
    box-shadow: 0 2px 8px var(--shadow);
    animation: rise 0.32s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--line);
    border-radius: 7px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
  }
  .check:hover { border-color: var(--accent); }
  .check.on {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check.on::after {
    content: '';
    width: 6px; height: 10px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }

  .body { flex: 1; min-width: 0; }
  .text {
    font-size: var(--note-font, 0.97rem);
    font-weight: 600;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .item.done .text {
    color: var(--done);
    text-decoration: line-through;
    text-decoration-color: var(--done);
  }
  .meta {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .note-head { display: flex; align-items: flex-start; gap: 6px; border-radius: 9px; padding: 7px 8px; margin-bottom: 6px; }
  .item.idea .note-head { background: var(--accent-soft); }
  .item.todo .note-head { background: var(--todo-soft); }
  .note-head .text { flex: 1; min-width: 0; }
  .note-head .more-btn { flex-shrink: 0; margin-left: 0; margin-top: 2px; }
  /* 类别小标签（常显，只读） */
  .cat-tag {
    font-size: 0.66rem;
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    cursor: pointer;
    display: inline-block;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .cat-tag * { pointer-events: none; }
  .cat-tag-color { font-weight: 600; }
  .cat-tag:hover { border-color: var(--accent); color: var(--accent); }
  .cat-tag-empty { border-style: dashed; }
  /* 更多按钮 */
  .more-btn {
    margin-left: auto;
    border: 1px solid var(--line);
    background: var(--line);
    color: var(--ink-soft);
    font-size: 0.9rem;
    line-height: 1;
    padding: 3px 12px;
    border-radius: 20px;
    cursor: pointer;
  }
  .more-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  /* 操作按钮行：默认收起 */
  .meta-actions {
    display: none;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .meta-actions.show { display: flex; }
  .meta-actions.show .del-btn { background: rgba(200,85,61,0.09); border-color: var(--danger,#c8553d); color: var(--danger,#c8553d); }
  /* 所有展开的 ⋯ 面板中，按钮统一使用强调色背景，删除按钮保持红色 */
  .meta-actions.show button,
  .sub-more-panel.open button,
  .ss-more-panel.open button,
  .sss-more-panel.open button,
  .l5-more-panel.open button {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    opacity: 1;
  }
  .sub-more-panel.open [data-act*="del"],
  .ss-more-panel.open [data-act*="del"],
  .sss-more-panel.open [data-act*="del"],
  .l5-more-panel.open [data-act*="del"] {
    background: rgba(200,85,61,0.12);
    border-color: var(--danger, #c8553d);
    color: var(--danger, #c8553d);
  }
  .pin-badge {
    font-size: 0.7rem;
    color: var(--accent);
    margin-right: 2px;
  }
  .item.pinned {
    box-shadow: 0 0 0 2px var(--accent)33, 0 4px 16px var(--shadow);
  }
  .badge {
    font-size: 0.66rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .badge.idea { background: var(--accent-soft); color: var(--accent); }
  .badge.todo { background: #e0e8df; color: #4a6b48; }

  .remind-btn {
    border: 1px solid var(--line);
    background: var(--line);
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .remind-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .remind-tag {
    font-size: 0.68rem;
    padding: 2px 9px;
    border-radius: 20px;
    background: #eae3f0;
    color: #6b4a8a;
    cursor: pointer;
    font-weight: 500;
  }
  .remind-tag.past { background: var(--line); color: var(--ink-soft); text-decoration: line-through; }

  .empty-text[data-act="edit"] { cursor: text; }
  .text.empty-text { color: var(--ink-soft); opacity: 0.6; font-style: italic; }
  .edit-btn {
    border: 1px solid var(--line);
    background: var(--line);
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .edit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* 子项 */
  .subs-wrap { margin: 8px 0 4px; }
  .subs-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 20px;
  }
  .subs-toggle:hover { border-color: var(--accent); }
  .subs-toggle * { pointer-events: none; }
  .subs-toggle .st-arrow { font-size: 0.7rem; color: var(--accent); transition: transform 0.2s; }
  .subs-toggle.collapsed .st-arrow { transform: rotate(-90deg); }
  .st-label { font-weight: 600; }
  .subs {
    margin: 4px 0 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 2px solid var(--line);
    padding-left: 10px;
  }
  .sub-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 4px 0;
    flex-wrap: wrap;
  }
  .sub-check {
    width: 17px; height: 17px;
    border: 2px solid var(--ink-soft);
    border-radius: 5px;
    flex-shrink: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
    margin-top: 2px;
  }
  .sub-check:hover { border-color: var(--accent); }
  .sub-check.on { background: var(--accent); border-color: var(--accent); }
  .sub-check.on::after {
    content: '';
    width: 4px; height: 8px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }
  .sub-bullet {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    margin-top: 7px;
    opacity: 0.55;
  }
  .sub-num {
    font-size: 0.8rem;
    color: var(--accent);
    flex-shrink: 0;
    min-width: 16px;
    text-align: right;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
    font-weight: 500;
  }
  /* Sub-sub-items (grandchildren) */
  .subsub-list {
    margin: 4px 0 2px 22px;
    border-left: 2px solid var(--line);
    padding-left: 10px;
  }
  .subsub-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 3px 0;
  }
  .subsub-check {
    width: 13px; height: 13px;
    border: 2px solid var(--ink-soft);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    margin-top: 3px;
    transition: all 0.15s;
    display: grid; place-items: center;
  }
  .subsub-check:hover { border-color: var(--accent); }
  .subsub-check.on { background: var(--accent); border-color: var(--accent); }
  .subsub-check.on::after {
    content: '';
    width: 3px; height: 6px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;

  #remind-input:focus { border-color: var(--accent); }
  .quick-times {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 13px;
  }
  .quick-times button {
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    font-size: 0.76rem;
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-times button:hover { border-color: var(--accent); color: var(--accent); }
  .repeat-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 500;
    margin: 16px 0 8px;
  }
  .repeat-opts {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .repeat-opts button {
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 6px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .repeat-opts button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 20px;
  }
  .modal-actions button {
    border: none;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 11px;
    cursor: pointer;
  }
  .m-del { background: transparent; color: var(--accent); padding: 9px 4px !important; }
  .m-cancel { background: var(--bg); color: var(--ink-soft); }
  .m-ok { background: var(--ink); color: var(--paper); }
  .confirm-danger { background: var(--accent) !important; color: #fff !important; }

  #prompt-input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 11px;
    padding: 11px 13px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    box-sizing: border-box;
    margin-top: 4px;
  }
  #prompt-input:focus { border-color: var(--accent); }

  .catpick-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 14px 0 4px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .catpick-item {
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    text-align: left;
    padding: 12px 14px;
    border-radius: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .catpick-item:hover { border-color: var(--accent); }
  .catpick-item.sel {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }
  .catpick-item.danger { color: var(--accent); }

  /* 背景选择 */
  .bg-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 14px 0 4px;
  }
  .bg-swatch {
    border: 2px solid var(--line);
    border-radius: 12px;
    height: 70px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.2s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .bg-swatch:active { transform: scale(0.95); }
  .bg-swatch.sel { border-color: var(--accent); }
  .bg-swatch .nm {
    font-size: 0.68rem;
    background: rgba(0,0,0,0.35);
    color: #fff;
    width: 100%;
    text-align: center;
    padding: 2px 0;
    backdrop-filter: blur(2px);
  }
  .bg-swatch.sel::after {
    content: '✓';
    position: absolute;
    top: 4px; right: 6px;
    color: #fff;
    background: var(--accent);
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 0.7rem;
    display: grid;
    place-items: center;
  }
  .bg-photo-swatch {
    border-style: dashed;
    flex-direction: column;
    gap: 2px;
    background-color: var(--paper);
  }
  .bg-photo-swatch.has-photo {
    background-size: cover;
    background-position: center;
    border-style: solid;
  }
  .bg-photo-swatch.sel { border-style: solid; }
  .bg-photo-icon { font-size: 1.5rem; line-height: 1; }
  .bg-photo-add { font-size: 0.62rem; color: var(--ink-soft); }
  .modal-note {
    font-size: 0.7rem;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.5;
    opacity: 0.85;
  }

  /* reminder banner */
  .remind-banner {
    position: fixed;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 420px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 11px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    z-index: 200;
    transition: top 0.4s cubic-bezier(0.2,0.9,0.3,1);
  }
  .remind-banner.show { top: 16px; }
  .remind-banner .rb-ic { font-size: 1.3rem; }
  .remind-banner .rb-txt { flex: 1; font-size: 0.9rem; line-height: 1.4; }
  .remind-banner .rb-x {
    border: none;
    background: rgba(255,255,255,0.18);
    color: var(--paper);
    font-family: inherit;
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
  }


  /* attachments on cards */
  .atts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .att-img {
    width: 76px; height: 76px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .att-img:active { transform: scale(0.95); }
  .att-pdf {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.78rem;
    color: var(--ink);
    cursor: pointer;
    max-width: 200px;
    transition: transform 0.15s;
  }
  .att-pdf:active { transform: scale(0.97); }
  .att-pdf .pic { font-size: 1.1rem; flex-shrink: 0; }
  .att-pdf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .big {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.3rem;
    margin-bottom: 6px;
  }
  .empty .small { font-size: 0.85rem; opacity: 0.8; }

  /* composer */
  .composer {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px;
    width: calc(100% - 36px);
    max-width: 584px;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(200, 85, 61, 0.28);
    padding: 12px;
    z-index: 20;
    transition: opacity 0.2s, transform 0.2s;
  }
  /* 收起：隐藏输入栏 */
  .composer.collapsed {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(20px);
  }
  /* 收起按钮（向下箭头） */
  .composer-hide {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 26px;
    border: 1.5px solid var(--accent);
    border-bottom: none;
    background: var(--accent-soft);
    border-radius: 13px 13px 0 0;
    color: var(--accent);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 -3px 10px rgba(200,85,61,0.12);
  }
  /* 浮动展开按钮 */
  .fab {
    position: fixed;
    right: 22px;
    bottom: 24px;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1.9rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(200,85,61,0.45);
    z-index: 19;
    display: none;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }
  .fab.show { display: block; }
  .ctype {
    display: flex;
    gap: 6px;
    margin-bottom: 9px;
  }
  .ctype button {
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 5px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctype button.sel.idea { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ctype button.sel.todo { background: #4a6b48; color: #fff; border-color: #4a6b48; }
  .creminder.set { background: #eae3f0; color: #6b4a8a; border-color: #d4c2e0; }
  .ccat.set { background: #e3ecf5; color: #2e6a9e; border-color: #b8d4e8; }

  .crow { display: flex; gap: 9px; align-items: flex-end; }
  textarea {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.97rem;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.45;
    max-height: 120px;
    padding: 6px 4px;
  }
  textarea::placeholder { color: var(--ink-soft); opacity: 0.6; }

  /* 富文本输入框 */
  .rich-input {
    flex: 1;
    font-family: inherit;
    font-size: 0.97rem;
    color: var(--ink);
    outline: none;
    line-height: 1.45;
    max-height: 120px;
    overflow-y: auto;
    padding: 9px 11px;
    min-height: 1.45em;
    word-break: break-word;
    background: var(--paper);
    border-radius: 11px;
    border: 1px solid var(--line);
  }
  .rich-input:empty::before {
    content: attr(data-ph);
    color: var(--ink-soft);
    opacity: 0.6;
  }
  .color-wrap {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 4px 4px 2px;
    flex-wrap: wrap;
  }
  .color-toggle {
    border: 1px solid var(--line);
    background: transparent;
    font-size: 1rem;
    width: 30px; height: 30px;
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
  }
  .color-toggle.on { border-color: var(--accent); background: var(--accent-soft); }
  .fmt-bar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .fmt-btn {
    border: 1px solid var(--line); background: transparent;
    border-radius: 7px; cursor: pointer; padding: 0 5px;
    height: 28px; min-width: 28px; font-family: inherit; font-size: 0.82rem;
    color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; line-height: 1;
  }
  .fmt-btn:hover { border-color: var(--accent); color: var(--accent); }
  .fmt-btn.on { border-color: var(--accent); background: var(--accent-soft); }
  .color-bar {
    display: none;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex: 1;
  }
  .color-bar.show { display: flex; }
  .color-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s;
  }
  .color-dot:active { transform: scale(0.85); }
  .color-dot.cur { box-shadow: 0 0 0 2px var(--accent); }
  .color-custom {
    width: 24px; height: 24px;
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .color-custom input[type="color"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .color-whole {
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    font-size: 0.7rem;
    color: var(--ink-soft);
    padding: 2px 10px;
    border-radius: 20px;
    cursor: pointer;
  }
  .color-whole:hover { border-color: var(--accent); color: var(--accent); }

  .send {
    border: none;
    background: var(--ink);
    color: var(--paper);
    width: 42px; height: 42px;
    border-radius: 13px;
    font-size: 1.3rem;
    cursor: pointer;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    transition: transform 0.15s, background 0.2s;
  }
  .send:active { transform: scale(0.92); }
  .send:disabled { opacity: 0.35; cursor: default; }

  /* attach button in composer */
  .attach {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    width: 42px; height: 42px;
    border-radius: 13px;
    font-size: 1.25rem;
    cursor: pointer;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    transition: all 0.2s;
  }
  .attach:hover { border-color: var(--accent); color: var(--accent); }

  .attach-menu {
    position: absolute;
    left: 12px;
    bottom: 64px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(43, 39, 34, 0.18);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 30;
    animation: rise 0.18s ease both;
  }
  .attach-menu.show { display: flex; }
  .attach-menu button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--ink);
    text-align: left;
    padding: 9px 16px 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .attach-menu button:hover { background: var(--accent-soft); }

  /* pending attachment previews in composer */
  .pending {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pending:empty { display: none; }
  .pend {
    position: relative;
    border-radius: 9px;
    overflow: hidden;
  }
  .pend img {
    width: 56px; height: 56px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--line);
    border-radius: 9px;
  }
  .pend .pdf-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 56px;
    padding: 0 12px;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 0.72rem;
    max-width: 150px;
  }
  .pend .pdf-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pend .rm {
    position: absolute;
    top: -6px; right: -6px;
    width: 19px; height: 19px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: 2px solid var(--paper);
    font-size: 0.7rem;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  /* lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 15, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: calc(env(safe-area-inset-top, 0px) + 60px)
             calc(env(safe-area-inset-right, 0px) + 24px)
             calc(env(safe-area-inset-bottom, 0px) + 24px)
             calc(env(safe-area-inset-left, 0px) + 24px);
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.5);
  }
  .lightbox .close {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: none;
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
  }

  /* ===== 密码锁屏 ===== */
  #lock-screen {
    position: fixed;
    inset: 0;
    z-index: 9900;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #lock-screen.hidden { display: none; }
  .lock-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    width: 100%;
    max-width: 300px;
    padding: 0 20px;
  }
  .lock-brand {
    font-family: 'Fraunces', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--ink);
  }
  .lock-brand em { font-style: italic; color: var(--accent); }
  .lock-dots { display: flex; gap: 16px; }
  .ld {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    transition: background 0.15s;
  }
  .ld.on { background: var(--ink); }
  @keyframes lock-shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-8px); }
    40%,80% { transform: translateX(8px); }
  }
  .lock-dots.shake { animation: lock-shake 0.38s ease; }
  .lock-msg {
    font-size: 0.82rem;
    color: var(--accent);
    min-height: 1.1em;
    text-align: center;
  }
  .lock-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }
  .lk {
    height: 62px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-size: 1.45rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform 0.1s, background 0.1s;
    font-family: inherit;
  }
  .lk:active { transform: scale(0.93); background: var(--line); }
  .lk-del { font-size: 1.1rem; color: var(--ink-soft); }
  .lk-ok { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lk-ok:active { filter: brightness(0.88); background: var(--accent); }
  .lock-footer { font-size: 0.72rem; color: var(--ink-soft); margin-top: 4px; cursor: pointer; text-decoration: underline; }

  /* ===== Desktop layout (≥ 900 px) ===== */
  #desktop-pane { display: none; }
  .desktop-new-btn { display: none; }
  .header-add-btn { display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 300; }

  @media (min-width: 900px) {
    body { overflow: hidden; height: 100vh; }
    #app-wrap {
      display: flex;
      height: 100vh;
      overflow: hidden;
      align-items: stretch;
      transform: none !important;
    }
    .wrap {
      width: 380px;
      max-width: 380px;
      min-width: 260px;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      height: 100vh;
      overflow: hidden;
    }
    .wrap header { flex-shrink: 0; padding: 0 10px; }
    #list { flex: 1; overflow-y: auto; padding: 0 10px 20px; }
    .fab { display: none !important; }
    .header-add-btn { display: none !important; }
    .composer { display: none !important; }
    #desktop-pane #composer {
      display: block !important;
      position: static !important;
      width: 100%;
      max-width: 100%;
      border-radius: 0;
      border: none;
      box-shadow: none;
      padding: 20px 24px;
      margin: 0;
    }
    #desktop-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg);
      min-width: 0;
    }
    #desktop-pane .item {
      margin: 20px 24px;
      max-width: 100%;
    }
    .desktop-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--ink-soft);
      font-size: 1rem;
      padding: 40px;
      text-align: center;
      min-height: 300px;
    }
    .desktop-empty-icon { font-size: 2.5rem; opacity: 0.3; }
    .desktop-new-btn {
      display: inline-flex !important;
      align-items: center;
      gap: 4px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      margin-right: 4px;
    }
    .desktop-new-btn:hover { opacity: 0.85; }
    #list .item.desktop-selected {
      border-color: var(--accent) !important;
      background: color-mix(in srgb, var(--accent) 8%, var(--card)) !important;
    }
    .desktop-pane-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      padding: 16px 24px 8px;
      border-bottom: 1px solid var(--line);
      margin: 0;
      flex-shrink: 0;
    }
  }

  /* ===== TTS 朗读控制条 ===== */

// 根据选择的种类，弹出系统文件选择并读取，返回附件数组
function pickFilesByKind(kind) {
  return new Promise(resolve => {
    if (!kind) return resolve([]);
    const picker = document.createElement('input');
    picker.type = 'file';
    if (kind === 'camera') { picker.accept = 'image/*'; picker.capture = 'environment'; }
    else if (kind === 'image') { picker.accept = 'image/*'; picker.multiple = true; }
    else { picker.accept = 'application/pdf'; picker.multiple = true; }
    picker.onchange = async ev => {
      const out = [];
      for (const file of Array.from(ev.target.files || [])) {
        const att = await readFile(file);
        if (att) out.push(att);
      }
      resolve(out);
    };
    picker.click();
  });
}

<script>
// 提醒铃声：用 Web Audio 合成，无需外部文件
let audioCtx = null;
function playChime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    // 一组"叮咚"音调
    const tune = [880, 1108, 880, 1108];
    const rounds = 4;        // 重复几轮
    const noteDur = 0.32;    // 每个音长
    const roundGap = 0.5;    // 每轮之间的停顿
    let beat = 0;
    for (let r = 0; r < rounds; r++) {
      tune.forEach(f => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(audioCtx.destination);
        const t = now + beat * noteDur + r * roundGap;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.5, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, t + noteDur - 0.02);
        o.start(t); o.stop(t + noteDur);
        beat++;
      });
    }
  } catch (e) {}
}
</script>

<script>
// ===== IndexedDB 附件存储 + 笔记主存储 =====
// 附件（照片/PDF）和笔记文字都存这里，容量远大于 localStorage
const IDB_NAME = 'quicknotes-db';
const IDB_STORE = 'blobs';
const IDB_NOTES_STORE = 'notes_data';
let _idb = null;

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (_idb) return resolve(_idb);
    const req = indexedDB.open(IDB_NAME, 2); // v2：新增 notes_data store
    req.onupgradeneeded = e => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if (!db.objectStoreNames.contains(IDB_NOTES_STORE)) db.createObjectStore(IDB_NOTES_STORE);
    };
    req.onsuccess = () => { _idb = req.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}

// 把笔记和分类异步写入 IDB（fire-and-forget，不阻塞 UI）
function saveToIDB() {
  idbOpen().then(db => {
    const tx = db.transaction(IDB_NOTES_STORE, 'readwrite');
    const st = tx.objectStore(IDB_NOTES_STORE);
    st.put(JSON.stringify(notes), 'notes');
    st.put(JSON.stringify(cats), 'cats');
  }).catch(() => {});
}

// 从 IDB 读笔记和分类
async function loadFromIDB() {
  try {
    const db = await idbOpen();
    const tx = db.transaction(IDB_NOTES_STORE, 'readonly');
    const st = tx.objectStore(IDB_NOTES_STORE);
    const get = key => new Promise((res, rej) => {
      const r = st.get(key); r.onsuccess = () => res(r.result); r.onerror = rej;
    });
    const [n, c] = await Promise.all([get('notes'), get('cats')]);
    if (n == null) return null;
    return { notes: JSON.parse(n), cats: c != null ? JSON.parse(c) : null };
  } catch { return null; }
}
async function idbPut(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => resolve(null);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}

// 取附件的实际数据：新附件从 IndexedDB 取，老附件直接用内联 data（兼容）
async function getAttData(att) {
  if (!att) return null;
  if (att.data) return att.data;            // 老格式：内联 base64
  if (att.blobId) return await idbGet(att.blobId);  // 新格式：从 IDB 取
  return null;
}

function timeAgo(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  const date = new Date(ts);
  return `${date.getMonth()+1}月${date.getDate()}日`;
}

function fullDate(ts) {
  const d = new Date(ts);
  if (!ts || isNaN(d.getTime())) return '未知时间';
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  const ymd = (d.getFullYear() === now.getFullYear())
    ? `${d.getMonth()+1}月${d.getDate()}日`
    : `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  return `${ymd} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 判断一条记录是否"过期"：自身或任一子项设了非重复提醒且时间已过
function isOverdue(n) {
  const now = Date.now();
  const exp = o => o && o.remindAt && o.remindAt < now && (!o.repeat || o.repeat === 'none');
  if (exp(n)) return true;
  if (n.subs && n.subs.some(exp)) return true;
  return false;
}

function render() {
  const list = document.getElementById('list');
  let items = notes.filter(n => !n._deleted).sort((a,b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (a.done !== b.done) return a.done ? 1 : -1;
    return b.ts - a.ts;
  });
  if (filter === '__overdue') items = items.filter(isOverdue);
  else if (filter !== 'all') items = items.filter(n => n.cat === filter);

  // 搜索过滤
  if (searchQuery) items = items.filter(matchSearch);

  renderTabs();
  if (typeof updateCCatBtn === 'function') updateCCatBtn();

  // 若当前停在"已过期"但已无过期项，自动回到全部
  if (filter === '__overdue' && items.length === 0 && !searchQuery) { filter = 'all'; render(); return; }

  if (items.length === 0) {
    if (searchQuery) {
      list.innerHTML = `<div class="empty"><div class="big">没有找到「${esc(searchQuery)}」</div><div class="small">换个关键词试试</div></div>`;
      return;
    }
    const catName = filter === 'all' ? '' : (cats.find(c=>c.id===filter)?.name || '');
    list.innerHTML = `<div class="empty"><div class="big">${filter==='all'?'空空如也':'「'+catName+'」还没有内容'}</div><div class="small">在下面输入框记录第一条吧</div></div>`;
    return;
  }

  // 「全部」和「已过期」视图：按类别分组、可折叠；其他（具体类别）平铺
  if (filter === 'all' || filter === '__overdue') {
    // 分组：每个类别一组，外加"未分类"
    const groups = [];
    cats.forEach(c => {
      const arr = items.filter(n => n.cat === c.id);
      if (arr.length) groups.push({ id: c.id, name: c.name, arr });
    });
    const uncat = items.filter(n => !n.cat || !cats.find(c => c.id === n.cat));
    if (uncat.length) groups.push({ id: '__uncat', name: t('uncat'), arr: uncat });

    list.innerHTML = groups.map(g => {
      const collapsed = searchQuery ? false : isCollapsed(g.id);
      return `
        <div class="cat-group">
          <button class="cat-group-head ${collapsed?'collapsed':''}" data-group="${g.id}">
            <span class="cg-arrow">▾</span>
            <span class="cg-name">${esc(g.name)}</span>
            <span class="cg-count">${g.arr.length}</span>
          </button>
          <div class="cat-group-body" ${collapsed?'style="display:none"':''}>
            ${g.arr.map(renderItem).join('')}
          </div>
        </div>`;
    }).join('');
  } else {
    list.innerHTML = items.map(renderItem).join('');
  }
  hydrateImages(list);
  if (typeof renderDesktopPane === 'function' && window.innerWidth >= 900) {
    renderDesktopPane();
    highlightSelectedInList();
  }
}

// 渲染后，把所有带 data-blobid 的图片从 IndexedDB 填充实际数据
async function hydrateImages(root) {
  const imgs = (root || document).querySelectorAll('img[data-blobid]');
  for (const img of imgs) {
    const id = img.getAttribute('data-blobid');
    img.removeAttribute('data-blobid');
    const data = await idbGet(id);
    if (data) img.src = data;
  }
}

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// 富文本清洗：只保留颜色相关的 span/font，其余标签去掉，纯文本转义
function sanitizeRich(html) {
  const tpl = document.createElement('div');
  tpl.innerHTML = html;
  const FS_MAP = {'1':'0.75em','2':'0.85em','3':'1em','4':'1.2em','5':'1.5em','6':'2em','7':'2.5em'};
  const safeFs = v => /^[\d.]+(px|em|rem|%|pt)$|^(x-small|small|medium|large|x-large|xx-large|xxx-large|smaller|larger)$/.test((v||'').trim());
  const walk = (node) => {
    let out = '';
    node.childNodes.forEach(ch => {
      if (ch.nodeType === 3) { out += esc(ch.nodeValue); }
      else if (ch.nodeType === 1) {
        const tag = ch.tagName.toLowerCase();
        if (tag === 'br') { out += '<br>'; return; }
        const inner = walk(ch);
        // underline
        if (tag === 'u') { out += `<u>${inner}</u>`; return; }
        // color
        const color = (ch.style && ch.style.color) ? ch.style.color
                    : (ch.getAttribute && ch.getAttribute('color')) || '';
        // font-size: from inline style (styleWithCSS) or <font size="X">
        let fs = (ch.style && ch.style.fontSize) ? ch.style.fontSize.trim() : '';
        if (!fs && tag === 'font') { const s = ch.getAttribute('size'); if (s) fs = FS_MAP[s]||''; }
        if (fs && !safeFs(fs)) fs = '';
        // combine
        const styles = [];
        if (color) styles.push(`color:${esc(color)}`);
        if (fs)    styles.push(`font-size:${esc(fs)}`);
        if ((tag === 'span' || tag === 'font' || tag === 'div' || tag === 'p') && styles.length) {
          out += `<span style="${styles.join(';')}">${inner}</span>`;
        } else {
          if (tag === 'div' || tag === 'p') out += inner + '<br>';
          else out += inner;
        }
      }
    });
    return out;
  };
  return walk(tpl).replace(/(<br>)+$/,'');
}
// 取纯文本（用于搜索、预览、判空）
function plainOf(htmlOrText) {
  const d = document.createElement('div');
  d.innerHTML = htmlOrText || '';
  return (d.textContent || '').trim();
}

// 搜索：先转义/取文本，再把匹配的关键词用 <mark> 高亮
let searchQuery = '';
function escForRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlight(n) {
  // n 可以是记录对象、子项对象（均含 rich 标志），或纯字符串
  const isObj = (typeof n === 'object' && n !== null);
  const raw = isObj ? (n.text || '') : (n || '');
  const rich = isObj && n.rich;
  let display = rich ? sanitizeRich(raw) : esc(raw);
  if (!searchQuery) return display;
  // 高亮：在纯文本层面找词，简单处理——对显示串做不跨标签替换
  try {
    const re = new RegExp('(' + escForRegex(searchQuery) + ')', 'gi');
    // 仅替换不在标签内的文本
    display = display.replace(/(>[^<]*<)|(^[^<]*<)|(>[^<]*$)|(^[^<]*$)/g, m => m.replace(re, '<mark>$1</mark>'));
  } catch (e) {}
  return display;
}
// 判断一条记录是否匹配搜索词（正文/子项/类别名）
function matchSearch(n) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  if (plainOf(n.text).toLowerCase().includes(q)) return true;
  if (n.subs && n.subs.some(s =>
    plainOf(s.text).toLowerCase().includes(q) ||
    (s.subs && s.subs.some(ss => plainOf(ss.text).toLowerCase().includes(q)))
  )) return true;
  const cat = cats.find(c => c.id === n.cat);
  if (cat && cat.name.toLowerCase().includes(q)) return true;
  return false;
}

// 预设颜色（多一些）
const PRESET_COLORS = [
  '', '#c8553d', '#e0673a', '#d98324', '#e6a817', '#b5a700',
  '#6b8e23', '#4a8c4a', '#2e9b8f', '#3a72c4', '#4455c4', '#6a40b8',
  '#8a4fbf', '#b5479b', '#c43a6e', '#8c6d4a', '#5a5a5a'
];
// 检查 richEl 内是否有非空文字选区
// 生成一个颜色条元素，绑定到指定富文本编辑区
function buildColorBar(richEl) {
  const wrap = document.createElement('div');
  wrap.className = 'color-wrap';

  // ── 始终可见的格式栏 ──────────────────────────────
  const fmtBar = document.createElement('div');
  fmtBar.className = 'fmt-bar';

  // 字号 em 映射
  const FS_EM = {'2':'0.85em','3':'1em','4':'1.2em','5':'1.5em'};

  // 格式状态 — 独立追踪，不依赖 innerHTML 堆叠
  const fmt = { size: null, underline: false };

  // 从现有 innerHTML 初始化 underline 状态（编辑已有下划线的内容时）
  (function initFmt() {
    const tmp = document.createElement('div');
    tmp.innerHTML = richEl.innerHTML;
    if (tmp.childNodes.length === 1 &&
        tmp.firstChild.nodeType === 1 &&
        tmp.firstChild.tagName.toLowerCase() === 'u') {
      fmt.underline = true;
    }
  })();

  // 剥掉已知格式包装层，取基础内容
  function getBase() {
    const tmp = document.createElement('div');
    tmp.innerHTML = richEl.innerHTML;
    // 去最外层 <u>（无论 fmt.underline 状态，先剥掉再由 reapply 决定是否重新套回）
    if (tmp.childNodes.length === 1 &&
        tmp.firstChild.nodeType === 1 &&
        tmp.firstChild.tagName.toLowerCase() === 'u') {
      tmp.innerHTML = tmp.firstChild.innerHTML;
    }
    // 去最外层 <span style="font-size:...">（字号在下划线内层）
    if (fmt.size &&
        tmp.childNodes.length === 1 &&
        tmp.firstChild.nodeType === 1 &&
        tmp.firstChild.tagName.toLowerCase() === 'span' &&
        tmp.firstChild.style.fontSize) {
      tmp.innerHTML = tmp.firstChild.innerHTML;
    }
    return tmp.innerHTML;
  }

  // 用当前状态重新渲染：字号在内，下划线在外
  function reapply() {
    const base = sanitizeRich(getBase());
    let result = base;
    if (fmt.size)      result = `<span style="font-size:${fmt.size}">${result}</span>`;
    if (fmt.underline) result = `<u>${result}</u>`;
    richEl.innerHTML = result;
    // Restore focus + move cursor to end so iOS keyboard stays open
    try {
      richEl.focus();
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(richEl);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    } catch {}
    sizeButtons.forEach(({ btn, fs }) => btn.classList.toggle('on', fmt.size === FS_EM[fs]));
    uBtn.classList.toggle('on', fmt.underline);
  }

  // 字号按钮 (S M L XL)
  const sizeButtons = [];
  [
    { label:'A', fs:'2', title:'小字',  css:'font-size:0.75em' },
    { label:'A', fs:'3', title:'正常',  css:'font-size:1em' },
    { label:'A', fs:'4', title:'大字',  css:'font-size:1.25em;font-weight:500' },
    { label:'A', fs:'5', title:'特大',  css:'font-size:1.55em;font-weight:600' },
  ].forEach(({ label, fs, title, css }) => {
    const btn = document.createElement('button');
    btn.className = 'fmt-btn fmt-size'; btn.type = 'button'; btn.title = title;
    btn.innerHTML = `<span style="${css}">${label}</span>`;
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      const sel = window.getSelection();
      const hasSelection = sel && !sel.isCollapsed && richEl.contains(sel.anchorNode);
      if (hasSelection) {
        // Apply size only to selected text
        richEl.focus();
        document.execCommand('fontSize', false, fs);
      } else {
        // No selection: toggle size for whole content
        fmt.size = (fmt.size === FS_EM[fs]) ? null : FS_EM[fs];
        reapply();
      }
    });
    sizeButtons.push({ btn, fs });
    fmtBar.appendChild(btn);
  });

  // 下划线按钮（点击切换开/关）
  const uBtn = document.createElement('button');
  uBtn.className = 'fmt-btn fmt-u'; uBtn.type = 'button'; uBtn.title = '下划线';
  uBtn.innerHTML = '<u style="text-underline-offset:2px">U</u>';
  uBtn.addEventListener('mousedown', e => e.preventDefault());
  uBtn.addEventListener('click', () => {
    const sel = window.getSelection();
    const hasSelection = sel && !sel.isCollapsed && richEl.contains(sel.anchorNode);
    if (hasSelection) {
      // 有选区：只对选中文字加/去下划线，不影响前后空白
      richEl.focus();
      document.execCommand('underline', false, null);
      uBtn.classList.toggle('on', document.queryCommandState('underline'));
    } else {
      // 无选区：整体切换
      fmt.underline = !fmt.underline;
      reapply();
    }
  });
  fmtBar.appendChild(uBtn);
  // 初始同步按钮高亮状态
  uBtn.classList.toggle('on', fmt.underline);

  // 颜色 toggle（放在格式栏末尾）
  const toggle = document.createElement('button');
  toggle.className = 'color-toggle'; toggle.type = 'button';
  toggle.textContent = '🎨'; toggle.title = '文字颜色';
  fmtBar.appendChild(toggle);

  // ── 可折叠颜色条 ──────────────────────────────────
  const bar = document.createElement('div');
  bar.className = 'color-bar';
  bar.innerHTML = PRESET_COLORS.map(c =>
    `<button class="color-dot" data-color="${c}" style="background:${c||'var(--ink)'}" ${c===''?'title="默认"':''}></button>`
  ).join('') +
  `<label class="color-custom" title="自定义颜色">＋<input type="color" class="color-pick"></label>
   <button class="color-whole" data-act="whole" title="整条变色">整条</button>`;

  wrap.appendChild(fmtBar);
  wrap.appendChild(bar);

  // 颜色 toggle 展开/收起
  toggle.addEventListener('mousedown', e => e.preventDefault());
  toggle.addEventListener('click', () => { bar.classList.toggle('show'); toggle.classList.toggle('on'); });

  bar.addEventListener('mousedown', e => { if (e.target.closest('.color-pick')) return; e.preventDefault(); });
  const applyColor = (color, whole) => {
    richEl.focus();
    try {
      if (whole) {
        const range = document.createRange(); range.selectNodeContents(richEl);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      const c = color || (getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#2b2722');
      document.execCommand('foreColor', false, c);
    } catch (err) {}
  };
  bar.addEventListener('click', e => {
    const dot = e.target.closest('.color-dot');
    if (dot) { applyColor(dot.dataset.color, false); return; }
    if (e.target.closest('[data-act="whole"]')) applyColor(bar._lastColor || '#c8553d', true);
  });
  const pick = bar.querySelector('.color-pick');
  pick.addEventListener('input', () => { bar._lastColor = pick.value; applyColor(pick.value, false); });
  return wrap;
}

function add() {
  const input = document.getElementById('input');
  const html = sanitizeRich(input.innerHTML);
  const plain = plainOf(input.innerHTML);
  if (!plain && pending.length === 0) return;
  const note = {
    id: Date.now()+''+Math.random().toString(36).slice(2,6),
    text: html, rich: true, type: curType, done: false, ts: Date.now(),
    atts: pending.slice()
  };
  // 当前正在某个类别下查看，新记录就归到该类别；全部视图下用手动选的类别
  if (filter !== 'all') note.cat = filter;
  else if (curCat) note.cat = curCat;
  if (pendingRemind) {
    note.remindAt = pendingRemind;
    note.repeat = pendingRepeat;
    note.remindFired = false;
  }
  notes.unshift(note);
  input.innerHTML = '';
  pending = [];
  pendingRemind = null;
  pendingRepeat = 'none';
  curCat = null;
  if (typeof updateCReminderBtn === 'function') updateCReminderBtn();
  if (typeof updateCCatBtn === 'function') updateCCatBtn();
  renderPending();
  refreshSendState();
  save();
  render();
  if (typeof window.closeComposer === 'function') window.closeComposer();
}

// 读取并压缩文件为 base64
// 把 base64 数据存进 IndexedDB，返回轻量附件对象
async function storeBlob(kind, name, dataUrl) {
  const blobId = 'b' + Date.now() + Math.random().toString(36).slice(2, 8);
  try {
    await idbPut(blobId, dataUrl);
    return { kind, name, blobId };
  } catch (e) {
    // IndexedDB 失败兜底：退回内联存储
    return { kind, name, data: dataUrl };
  }
}

function readFile(file) {
  return new Promise(resolve => {
    const name = (file.name || '').toLowerCase();
    const type = file.type || '';
    const isPdf = type === 'application/pdf' || name.endsWith('.pdf');
    const isImage = type.startsWith('image/') ||
      /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/.test(name);

    if (isPdf) {
      const r = new FileReader();
      r.onload = async () => resolve(await storeBlob('pdf', file.name || 'PDF文件', r.result));
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
      return;
    }

    if (isImage) {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = async () => {
          try {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (Math.max(w, h) > MAX_IMG_DIM) {
              const s = MAX_IMG_DIM / Math.max(w, h);
              w = Math.round(w * s); h = Math.round(h * s);
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(await storeBlob('image', file.name || '照片', c.toDataURL('image/jpeg', 0.82)));
          } catch (err) {
            resolve(await storeBlob('image', file.name || '照片', r.result));
          }
        };
        img.onerror = async () => {
          resolve(await storeBlob('image', file.name || '照片', r.result));
        };
        img.src = r.result;
      };
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
      return;
    }

    // 未知类型：尝试当作通用文件存下来
    const r = new FileReader();
    r.onload = async () => resolve(await storeBlob('pdf', file.name || '文件', r.result));
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

// 在卡片底部添加子项的输入框（富文本 + 颜色 + 附件）
function startAddSub(item, n) {
  // If form already open but off-screen, scroll to it and refocus instead of doing nothing
  const existingForm = item.querySelector('.sub-adding');
  if (existingForm) {
    const existingRich = existingForm.querySelector('[contenteditable]');
    item.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (existingRich) existingRich.focus();
    return;
  }
  const body = item.querySelector('.body');
  let subsBox = body.querySelector('.subs');
  if (!subsBox) {
    subsBox = document.createElement('div');
    subsBox.className = 'subs';
    const meta = body.querySelector('.meta');
    body.insertBefore(subsBox, meta);
  } else {
    // Expand if collapsed so the form is visible
    subsBox.style.display = '';
    const toggleBtn = body.querySelector('.subs-toggle');
    if (toggleBtn) toggleBtn.classList.remove('collapsed');
    collapsedSubs[n.id] = false;
    try { localStorage.setItem(SUBCOLLAPSE_KEY, JSON.stringify(collapsedSubs)); } catch {}
  }

  const row = document.createElement('div');
  row.className = 'sub-row sub-adding';

  // Rich contenteditable editor
  const rich = document.createElement('div');
  rich.className = 'sub-rich-edit edit-area';
  rich.contentEditable = 'true';
  rich.style.cssText = 'min-height:1.5em;max-height:150px;overflow-y:auto;outline:none;white-space:pre-wrap;word-break:break-word;flex:1;';

  const colorWrap = buildColorBar(rich);
  const fmtBar = colorWrap.querySelector('.fmt-bar');
  const colorBar = colorWrap.querySelector('.color-bar');

  // Toolbar: [🎨] [＋ 附件]
  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap;';
  const attBtn = document.createElement('button');
  attBtn.className = 'sub-att-btn';
  attBtn.type = 'button';
  attBtn.textContent = '📎 附件';
  toolbar.appendChild(fmtBar);
  toolbar.appendChild(attBtn);

  // Attachment list
  const attListEl = document.createElement('div');
  attListEl.className = 'edit-atts';
  let subAtts = [];
  const renderAttList = () => {
    attListEl.innerHTML = subAtts.map((a, i) =>
      a.kind === 'image'
        ? `<div class="edit-att"><img ${imgSrcAttr(a)} alt=""><button class="edit-att-rm" data-i="${i}">×</button></div>`
        : `<div class="edit-att edit-att-pdf"><span>📄 ${esc(a.name||'PDF')}</span><button class="edit-att-rm" data-i="${i}">×</button></div>`
    ).join('');
    hydrateImages(attListEl);
  };

  // Actions
  const actionsEl = document.createElement('div');
  actionsEl.className = 'edit-actions';
  actionsEl.style.marginTop = '6px';
  const okBtn = document.createElement('button');
  okBtn.className = 'edit-ok'; okBtn.textContent = '添加';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-cancel'; cancelBtn.textContent = '取消';
  actionsEl.appendChild(okBtn); actionsEl.appendChild(cancelBtn);

  // Wrap into a sub-main div so it fits the sub-row layout
  const mainDiv = document.createElement('div');
  mainDiv.className = 'sub-main';
  mainDiv.appendChild(toolbar);
  mainDiv.appendChild(colorBar);
  mainDiv.appendChild(rich);
  mainDiv.appendChild(attListEl);
  mainDiv.appendChild(actionsEl);

  row.appendChild(mainDiv);
  // Prepend so the form appears at the TOP of the subs list,
  // not buried below existing sub-items where it would be off-screen
  subsBox.prepend(row);

  // Close the meta-actions panel so it doesn't obscure the form
  const metaActions = body.querySelector('.meta-actions');
  if (metaActions) metaActions.classList.remove('show');
  const moreBtn = body.querySelector('.more-btn');
  if (moreBtn) moreBtn.classList.remove('on');

  rich.focus();
  // Scroll the whole card to the top so the form is near the top of the viewport,
  // well above the keyboard, regardless of how many subs already exist
  setTimeout(() => item.scrollIntoView({ behavior: 'smooth', block: 'start' }), 600);

  let committed = false;
  let pickingAtt = false;

  const commit = (saveIt) => {
    if (committed) return;
    committed = true;
    if (saveIt !== false) {
      const html = sanitizeRich(rich.innerHTML);
      const plain = plainOf(html);
      if (plain || subAtts.length) {
        // Re-find by ID: cloudPull replaces the notes array every 20s,
        // making the captured `n` reference stale
        const liveN = notes.find(x => x.id === n.id) || n;
        if (!liveN.subs) liveN.subs = [];
        liveN.subs.push({
          id: Date.now() + '' + Math.random().toString(36).slice(2, 5),
          text: html, rich: true, done: false,
          atts: subAtts.slice(), ts: Date.now()
        });
        liveN.modified = Date.now();
        save();
      }
    }
    render();
  };

  okBtn.addEventListener('mousedown', e => e.preventDefault());
  okBtn.addEventListener('click', () => commit(true));
  cancelBtn.addEventListener('mousedown', e => e.preventDefault());
  cancelBtn.addEventListener('click', () => commit(false));
  rich.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); commit(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
  });
  rich.addEventListener('blur', () => {
    setTimeout(() => {
      if (!committed && !pickingAtt && document.activeElement !== rich) {
        const html = sanitizeRich(rich.innerHTML);
        if (plainOf(html) || subAtts.length) commit(true);
        // if empty, keep form open — prevents keyboard-open blur from destroying it
      }
    }, 220);
  });

  attBtn.addEventListener('mousedown', e => e.preventDefault());
  attBtn.addEventListener('click', async () => {
    pickingAtt = true;
    const kind = await attachPicker();
    if (!kind) { pickingAtt = false; rich.focus(); return; }
    const got = await pickFilesByKind(kind);
    if (got.length) { subAtts.push(...got); renderAttList(); }
    pickingAtt = false; rich.focus();
  });

  attListEl.addEventListener('click', e => {

// 为子项选择文件（拍照/相册/PDF）
function pickSubFile(kind, subAtts, attBtn, inp) {
  const picker = document.createElement('input');
  picker.type = 'file';
  if (kind === 'camera') { picker.accept = 'image/*'; picker.capture = 'environment'; }
  else if (kind === 'image') { picker.accept = 'image/*'; picker.multiple = true; }
  else { picker.accept = 'application/pdf'; picker.multiple = true; }
  picker.onchange = async ev => {
    for (const file of Array.from(ev.target.files || [])) {
      const att = await readFile(file);
      if (att) subAtts.push(att);
    }
    attBtn.textContent = subAtts.length ? '📎' + subAtts.length : '📎';
    if (inp) inp.focus();
  };
  picker.click();
}

// 编辑某个子项文字
function startEditSub(span, n, s) {
  const row = span.closest('.sub-row');
  if (!row || row.querySelector('.sub-rich-edit')) return;
  const main = row.querySelector('.sub-main') || row;

  let editAtts = (s.atts || []).map(a => Object.assign({}, a));

  const wrap = document.createElement('div');
  wrap.className = 'edit-wrap';

  // Rich contenteditable editor
  const rich = document.createElement('div');
  rich.className = 'sub-rich-edit edit-area';
  rich.contentEditable = 'true';
  rich.style.cssText = 'min-height:1.5em;outline:none;white-space:pre-wrap;word-break:break-word;';
  rich.innerHTML = s.rich ? sanitizeRich(s.text || '') : esc(s.text || '');

  // Build colour bar and extract toggle + bar separately
  const colorWrap = buildColorBar(rich);
  const fmtBar = colorWrap.querySelector('.fmt-bar');
  const colorBar = colorWrap.querySelector('.color-bar');

  // Toolbar row: [🎨] [＋ 附件]
  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;';
  const addAttBtn = document.createElement('button');
  addAttBtn.className = 'edit-att-add';
  addAttBtn.type = 'button';
  addAttBtn.textContent = '＋ 附件';
  toolbar.appendChild(fmtBar);
  toolbar.appendChild(addAttBtn);

  // Attachment thumbnails list (no button here — button moved to toolbar)
  const attList = document.createElement('div');
  attList.className = 'edit-atts';
  const renderEA = () => {
    attList.innerHTML = editAtts.map((a, i) =>
      a.kind === 'image'
        ? `<div class="edit-att"><img ${imgSrcAttr(a)} alt=""><button class="edit-att-rm" data-i="${i}">×</button></div>`
        : `<div class="edit-att edit-att-pdf"><span>📄 ${esc(a.name||'PDF')}</span><button class="edit-att-rm" data-i="${i}">×</button></div>`
    ).join('');
    hydrateImages(attList);
  };
  renderEA();

  const actions = document.createElement('div');
  actions.className = 'edit-actions';
  actions.innerHTML = '<button class="edit-ok">保存</button><button class="edit-cancel">取消</button>';

  wrap.appendChild(toolbar);
  wrap.appendChild(colorBar);
  wrap.appendChild(rich);
  wrap.appendChild(attList);
  wrap.appendChild(actions);
  main.innerHTML = '';
  main.appendChild(wrap);
  rich.focus();
  // Move cursor to end
  try {
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(rich);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } catch {}

  addAttBtn.addEventListener('click', () => pickEA());
  attList.addEventListener('click', e => {
    const rm = e.target.closest('.edit-att-rm');
    if (rm) { editAtts.splice(+rm.dataset.i, 1); renderEA(); }
  });
  async function pickEA() {
    const kind = await attachPicker();
    if (!kind) return;
    const got = await pickFilesByKind(kind);
    if (got.length) { editAtts.push(...got); renderEA(); }
  }

  let done = false;
  const fin = (saveIt) => {
    if (done) return;
    done = true;
    if (saveIt) {
      const html = sanitizeRich(rich.innerHTML);
      const plain = plainOf(html);
      if (plain || editAtts.length) {
        const liveN = notes.find(x => x.id === n.id) || n;
        const liveS = (liveN.subs || []).find(x => x.id === s.id) || s;
        liveS.text = html;
        liveS.rich = true;
        liveS.atts = editAtts;
        liveN.modified = Date.now();
        save();
      }
    }
    render();
  };
  actions.querySelector('.edit-ok').onclick = () => fin(true);
  actions.querySelector('.edit-cancel').onclick = () => fin(false);
  rich.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); fin(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); fin(false); }
  });
}

// ===== 长按拖动给类别排序 =====
let tabDragging = false;
(function setupTabDrag() {
  const tabs = document.getElementById('tabs');
  const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
  let pressTimer = null, dragId = null, downX = 0, downY = 0, started = false;

  const onDown = e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    const f = t.dataset.filter;
    if (f === 'all' || f === '__add' || f === '__overdue') return;
    dragId = f; downX = e.clientX; downY = e.clientY; started = false;
    pressTimer = setTimeout(() => {
      started = true;                  // 进入"可拖动"准备状态
      const el = tabs.querySelector(`.tab[data-filter="${cssEsc(dragId)}"]`);
      if (el) el.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(15);
    }, 400);
  };

  const onMove = e => {
    if (!started) {
      if (pressTimer && (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4)) {
        clearTimeout(pressTimer); pressTimer = null;
      }
      return;
    }
    if (tabs.style.touchAction !== 'none') tabs.style.touchAction = 'none';
    e.preventDefault();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const draggable = [...tabs.querySelectorAll('.tab')].filter(el => {
      const f = el.dataset.filter;
      return f !== 'all' && f !== '__add' && f !== '__overdue';
    });
    if (!draggable.length) return;
    let targetCatId = null;
    for (const el of draggable) {
      const r = el.getBoundingClientRect();
      if (x < r.left + r.width / 2) { targetCatId = el.dataset.filter; break; }
    }
    const i = cats.findIndex(c => c.id === dragId);
    if (i < 0) return;
    let j;
    if (targetCatId === null) {
      j = cats.length - 1;
    } else if (targetCatId === dragId) {
      return;
    } else {
      j = cats.findIndex(c => c.id === targetCatId);
      if (j > i) j--;
    }
    if (j === i || j < 0) return;
    tabDragging = true;               // 真正发生移动交换，才标记为拖动
    const [moved] = cats.splice(i, 1);
    cats.splice(j, 0, moved);
    renderTabs();
    const el = tabs.querySelector(`.tab[data-filter="${cssEsc(dragId)}"]`);
    if (el) el.classList.add('dragging');
  };

  const onUp = () => {
    clearTimeout(pressTimer); pressTimer = null;
    tabs.style.touchAction = '';
    const wasDragging = tabDragging;
    if (started) {
      const el = tabs.querySelector(`.tab[data-filter="${cssEsc(dragId)}"]`);
      if (el) el.classList.remove('dragging');
      if (wasDragging) {
        save(); renderTabs();
      } else {
        // 长按但未移动 → 弹出管理菜单（重命名/删除/移动）
        const id = dragId;
        setTimeout(() => manageCategory(id), 10);
      }
    }
    started = false; dragId = null;
    if (wasDragging) {
      setTimeout(() => { tabDragging = false; }, 60);
    } else {
      tabDragging = false;
    }
  };

  tabs.addEventListener('pointerdown', onDown);
  tabs.addEventListener('contextmenu', e => { if (e.target.closest('.tab')) e.preventDefault(); });
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  // 触摸设备兜底
  tabs.addEventListener('touchstart', e => onDown(e.touches[0]), { passive: true });
  window.addEventListener('touchmove', e => { if (started) { e.preventDefault(); onMove(e); } }, { passive: false });
  window.addEventListener('touchend', onUp);
})();

  if (!nm) return;
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2,5);
  cats.push({ id, name: nm });
  filter = id;
  saveFilter();
  save(); render();
  return id;
}

async function manageCategory(id) {
  const c = cats.find(x => x.id === id);
  if (!c) return;
  const choice = await catManageDialog(c);
  if (choice === 'rename') {
    const name = await promptDialog('重命名类别', c.name);
    if (name == null) return;
    const v = name.trim();
    if (v) { c.name = v; save(); render(); }
  } else if (choice === 'delete') {
    if (await confirmDialog(`确定删除类别「${c.name}」吗？\n该类别下的记录不会被删除，会回到“全部”。`)) {
      notes.forEach(n => { if (n.cat === id) delete n.cat; });
      cats = cats.filter(x => x.id !== id);
      if (filter === id) { filter = 'all'; saveFilter(); }
      save(); render();
    }
  } else if (choice === 'left' || choice === 'right') {
    const i = cats.findIndex(x => x.id === id);
    const j = choice === 'left' ? i - 1 : i + 1;
    if (i >= 0 && j >= 0 && j < cats.length) {
      [cats[i], cats[j]] = [cats[j], cats[i]];   // 交换位置
      save(); render();
    }
  }
}

// ── 行内计算器：在任意输入框中，表达式后按 = 自动求值 ──────────────
function safeCalc(expr) {
  const s = expr.trim().replace(/,/g, '');
  if (!s || !/[+\-*\/%()]/.test(s)) return null;
  if (!/^[\d\s+\-*\/.()\%]+$/.test(s) || !/\d/.test(s)) return null;
  // Convert percentage: 20% → (20/100) so 100*20% = 100*(20/100) = 20
  const jsExpr = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
  try {
    const r = Function('"use strict";return(' + jsExpr + ')')();
    if (typeof r !== 'number' || !isFinite(r)) return null;
    return parseFloat(r.toPrecision(10));
  } catch { return null; }
}

// Guard flag prevents the input-event handler from re-firing on our own insertions
let _calcGuard = false;

function _doCalc(el, equalsAlreadyInserted) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.getRangeAt(0).collapsed) return false;
  const range = sel.getRangeAt(0);
  const pre = range.cloneRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  const before = pre.toString();
  // When = is already in DOM, exclude it before matching the expression
  const exprText = equalsAlreadyInserted ? before.slice(0, -1) : before;
  const m = exprText.match(/([\d(][\d\s+\-*\/.()\%,]*)$/);
  if (!m) return false;
  const val = safeCalc(m[1]);
  if (val === null) return false;

  const formatted = Number.isInteger(val) ? String(val) : String(parseFloat(val.toFixed(2)));
  const toInsert = equalsAlreadyInserted ? formatted : ('=' + formatted);
  const node = range.startContainer;
  const offset = range.startOffset;

  _calcGuard = true;
  if (node.nodeType === Node.TEXT_NODE) {
    const t = node.textContent;
    node.textContent = t.slice(0, offset) + toInsert + t.slice(offset);
    const nr = document.createRange();
    nr.setStart(node, offset + toInsert.length);
    nr.collapse(true);
    sel.removeAllRanges();
    sel.addRange(nr);
  } else {
    try { document.execCommand('insertText', false, toInsert); } catch {}
  }
  requestAnimationFrame(() => { _calcGuard = false; });
  showToast('= ' + formatted);
  return true;
}

  return sel ? sel.dataset.rep : 'none';
}
// 根据重复方式，把时间戳推进到下一个周期（直到晚于 now）
function nextOccurrence(ts, repeat) {
  if (!repeat || repeat === 'none') return null;
  const now = Date.now();
  let d = new Date(ts);
  let guard = 0;
  do {
    if (repeat === 'daily') d.setDate(d.getDate() + 1);
    else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
    else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
    else if (repeat === 'yearly') d.setFullYear(d.getFullYear() + 1);
    else return null;
    guard++;
  } while (d.getTime() <= now && guard < 1000);
  return d.getTime();
}

// 每 15 秒检查一次到期提醒
function checkReminders() {
  const now = Date.now();
  let changed = false;
  const handle = (obj, label) => {
    if (obj.remindAt && !obj.remindFired && obj.remindAt <= now) {
      changed = true;
      fireReminder({ text: label });
      const next = nextOccurrence(obj.remindAt, obj.repeat);
      if (next) { obj.remindAt = next; obj.remindFired = false; }
      else { obj.remindFired = true; }
    }
  };
  notes.forEach(n => {
    handle(n, n.text || '提醒');
    (n.subs || []).forEach(s => handle(s, s.text || '子项提醒'));
  });
  if (changed) { save(); render(); }
}

// 导出/上传前：深拷贝 notes，并把 IndexedDB 里的附件数据内联进去
async function notesWithInlineAtts() {
  const clone = JSON.parse(JSON.stringify(notes));
  const inlineList = async (atts) => {
    if (!atts) return;
    for (const a of atts) {
      if (!a.data && a.blobId) {
        const d = await idbGet(a.blobId);
        if (d) a.data = d;
      }
    }
  };
  for (const n of clone) {
    await inlineList(n.atts);
    if (n.subs) for (const s of n.subs) await inlineList(s.atts);
  }
  return clone;
}

// 导入/下载后：把内联的 data 拆回 IndexedDB，notes 里只留 blobId（保持轻量）
async function extractInlineAtts(list) {
  const extract = async (atts) => {
    if (!atts) return;
    for (const a of atts) {
      if (a.data && a.kind) {
        // 已有 blobId 就复用，否则新建
        const id = a.blobId || ('b' + Date.now() + Math.random().toString(36).slice(2,8));
        try { await idbPut(id, a.data); a.blobId = id; delete a.data; } catch (e) { /* 留着 data 兜底 */ }
      }
    }
  };
  for (const n of list) {
    await extract(n.atts);
    if (n.subs) for (const s of n.subs) await extract(s.atts);
  }
}

async function exportData() {

  const url = URL.createObjectURL(blob);

}

// 合并导入：按 id 去重，新数据补充进来，已存在的取较新的
function mergeNotes(incoming) {
  const byId = {};
  notes.forEach(n => byId[n.id] = n);
  incoming.forEach(n => {
    if (!n || !n.id) return;
    const cur = byId[n.id];
    if (!cur) {
      byId[n.id] = n; // 包括删除标记（tombstone），让本机也感知到删除
    } else {
      // 比较时间：删除时间 / 编辑时间 / 创建时间，取最新
      const nTime   = n._deletedAt   || n.modified || n.ts;
      const curTime = cur._deletedAt || cur.modified || cur.ts;
      byId[n.id] = (nTime >= curTime) ? n : cur;
    }
  });
  // 清理超过 60 天的 tombstone，避免数据无限增长
  const cutoff = Date.now() - 60 * 24 * 60 * 60 * 1000;
  notes = Object.values(byId)
    .filter(n => !n._deleted || (n._deletedAt && n._deletedAt > cutoff))
    .sort((a,b) => b.ts - a.ts);
}
