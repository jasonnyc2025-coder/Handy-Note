      const data = JSON.parse(r.result);
      const incoming = Array.isArray(data) ? data : data.notes;
      if (!Array.isArray(incoming)) throw new Error('格式不对');
      const before = notes.length;
      await extractInlineAtts(incoming);   // 把内联附件存入 IndexedDB
      mergeNotes(incoming);
      // 合并类别
      if (data.cats && Array.isArray(data.cats)) {
        const have = new Set(cats.map(c => c.id));
        data.cats.forEach(c => { if (c && c.id && !have.has(c.id)) cats.push(c); });
      }
      save(); render();
      alert(`导入成功！合并后共 ${notes.length} 条（原有 ${before} 条）。`);
    } catch (err) {
      alert('导入失败：文件格式不对，请选择本 app 导出的 .json 备份文件。');
    }
  };
  r.onerror = () => alert('读取文件失败，请重试。');
  r.readAsText(file);
});

async function _renderGoogleBtn(serverUrl) {

      client_id: googleClientId,

    });
    google.accounts.id.renderButton(btnDiv, {
      theme: 'outline', size: 'large', width: 260, locale: 'zh-CN', text: 'signin_with'
    });
    note.textContent = '';

async function _handleGoogleSignIn(response, serverUrl) {
  const note = document.getElementById('cloud-modal-note');
  note.textContent = '登录中…';
  try {
    const res = await fetch(`${serverUrl}/api/auth/google`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_token: response.credential })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || '认证失败');
    }
    const data = await res.json();
    cloud = { url: serverUrl, token: data.token, name: data.name, email: data.email, picture: data.picture };
    saveCloudCfg();
    // 拉取云端，合并后推送
    const remote = await cloudFetch();
    if (remote && Array.isArray(remote.notes)) {
      await extractInlineAtts(remote.notes);
      mergeNotes(remote.notes);
      if (Array.isArray(remote.cats)) {
        const have = new Set(cats.map(c => c.id));
        remote.cats.forEach(c => { if (c && c.id && !have.has(c.id)) cats.push(c); });
      }
    }
    save(); render(); updateCloudStatus();
    closeCloudModal();
    showToast(`✅ 已登录：${data.name}`);
    setInterval(cloudPull, 20000);
  } catch (err) {
    note.textContent = '❌ ' + err.message;
    cloud = null;
  }
}

// ── Sync API (JWT Bearer) ──────────────────────────────────────────────────

async function cloudFetch() {
  if (!cloud || !cloud.token) return false;
  try {
    const res = await fetch(`${cloud.url}/api/sync`, {
      headers: { 'Authorization': 'Bearer ' + cloud.token }
    });
    if (!res.ok) return false;
    return await res.json();
  } catch { return false; }
}

async function cloudPush() {
  if (!cloud || !cloud.token || cloudSyncing) return;
  cloudSyncing = true;
  try {
    const payload = await notesWithInlineAtts();
    await fetch(`${cloud.url}/api/sync`, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + cloud.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: payload, cats })
    });
  } catch {}
  cloudSyncing = false;
}

async function cloudPull() {
  if (!cloud || !cloud.token) return;
  const remote = await cloudFetch();
  if (!remote || !Array.isArray(remote.notes)) return;
  // 对比完整内容（不只是 ID），确保子项/编辑内容变化也能触发更新
  const before = JSON.stringify(notes);
  await extractInlineAtts(remote.notes);
  mergeNotes(remote.notes);
  if (Array.isArray(remote.cats)) {
    const have = new Set(cats.map(c => c.id));
    remote.cats.forEach(c => { if (c && c.id && !have.has(c.id)) cats.push(c); });
  }
  const after = JSON.stringify(notes);
  if (before !== after) {
    try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch {}
    render();
  }
}

function updateCloudStatus() {
  const el = document.getElementById('cloud-status');
  if (!el) return;
  if (cloud && cloud.token) {
    el.textContent = '☁️ 云同步已开启（' + (cloud.name || cloud.email) + '）';
    el.classList.add('on');
  } else {
    el.textContent = '☁️ 云同步未开启';
    el.classList.remove('on');
  }
}

// ===== 密码锁 =====
const LOCK_KEY = 'quicknotes.lock';
let _lockPin = '';

async function _hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('qn::' + pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function _updateDots() {
  document.querySelectorAll('.ld').forEach((d, i) => d.classList.toggle('on', i < _lockPin.length));
}
function _lockMsg(msg) { document.getElementById('lock-msg').textContent = msg || ''; }
function _shakeDots() {
  const el = document.getElementById('lock-dots');
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 400);
}

function showLockScreen() {
  _lockPin = '';
  _updateDots();
  _lockMsg('');
  document.getElementById('lock-screen').classList.remove('hidden');
}
function hideLockScreen() {
  document.getElementById('lock-screen').classList.add('hidden');
}

function loadLock() {
  try {
    if (localStorage.getItem(LOCK_KEY)) {
      showLockScreen();
      _updateLockNowBtn();
    }
  } catch {}
}

function _updateLockNowBtn() {
  const btn = document.getElementById('lock-now-btn');
  if (btn) btn.style.display = localStorage.getItem(LOCK_KEY) ? '' : 'none';
}

async function _tryUnlock() {
  if (_lockPin.length < 4) { _lockMsg('请输入4位密码'); return; }
  try {
    const stored = JSON.parse(localStorage.getItem(LOCK_KEY) || 'null');
    if (!stored) { hideLockScreen(); return; }
    const h = await _hashPin(_lockPin);
    if (h === stored.h) {
      hideLockScreen();
    } else {
      _lockMsg('密码错误，请重试');
      _shakeDots();
      _lockPin = '';
      _updateDots();
    }
  } catch { hideLockScreen(); }
}

document.getElementById('lock-screen').addEventListener('click', e => {
  const btn = e.target.closest('.lk');
  if (!btn) return;
  const d = btn.dataset.d;
  if (d === 'del') {
    _lockPin = _lockPin.slice(0, -1);
    _updateDots();
    _lockMsg('');
  } else if (d === 'ok') {
    _tryUnlock();
  } else {
    if (_lockPin.length < 4) {
      _lockPin += d;
      _updateDots();
      _lockMsg('');
      if (_lockPin.length === 4) _tryUnlock();
    }
  }
});

document.getElementById('lock-forgot').addEventListener('click', async () => {
  if (await confirmDialog('忘记密码将清除所有数据并解锁，确定继续？')) {

});

function showToast(msg, duration = 2200) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:20px;font-size:0.85rem;z-index:9999;opacity:0;transition:opacity 0.2s;max-width:82%;text-align:center;white-space:pre-line;box-shadow:0 4px 16px rgba(0,0,0,0.25);';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.style.opacity = '1');
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, duration);
}

async function setupLockPin() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch {}

  if (stored) {
    const action = await new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'modal show';
      modal.innerHTML = `<div class="modal-card">
        <div class="modal-title">🔒 密码锁</div>
        <div class="modal-sub">密码锁已开启</div>
        <div class="modal-actions" style="flex-direction:column;gap:8px;margin-top:14px;">
          <button class="m-ok" style="width:100%" data-v="change">🔑 修改密码</button>
          <button class="m-ok" style="width:100%" data-v="remove">🔓 关闭密码锁</button>
          <button class="m-cancel" data-v="">取消</button>
        </div>
      </div>`;
      document.body.appendChild(modal);
      modal.addEventListener('click', e => {
        const v = e.target.dataset.v;
        if (v !== undefined) { document.body.removeChild(modal); resolve(v || null); }
      });
    });
    if (!action) return;

    const cur = await promptDialog('请输入当前密码', '');
    if (cur == null) return;
    const curH = await _hashPin(cur.trim());
    if (curH !== stored.h) { showToast('❌ 密码错误'); return; }

    if (action === 'remove') {
      localStorage.removeItem(LOCK_KEY);
      _updateLockNowBtn();
      showToast('🔓 密码锁已关闭');
      return;
    }
  }

  const p1 = await promptDialog(stored ? '输入新密码（4位数字）' : '设置密码（4位数字）', '');
  if (p1 == null) return;
  if (!/^\d{4}$/.test(p1.trim())) { showToast('❌ 请输入恰好4位数字'); return; }
  const p2 = await promptDialog('再次输入确认', '');
  if (p2 == null) return;
  if (p1.trim() !== p2.trim()) { showToast('❌ 两次输入不一致'); return; }

  const h = await _hashPin(p1.trim());
  localStorage.setItem(LOCK_KEY, JSON.stringify({ h }));
  _updateLockNowBtn();
  showToast(stored ? '✅ 密码已修改' : '✅ 密码锁已开启\n下次打开时需要输入密码');
}

// Photo-style pinch-to-zoom: scales the entire app with CSS transform,
// so content never reflows (text stays same width, just visually larger).
;(function(){
  const B = document.getElementById('app-wrap');
  let s=1, tx=0, ty=0;                         // current scale & translation
  let _s, _tx, _ty, _d, _mx, _my, _sy;         // pinch-gesture start state
  let pan=null, _ptx=0, _pty=0;                 // single-finger pan state

  function draw(anim){
    B.style.transition = anim ? 'transform .22s ease' : 'none';
    B.style.transform  = s === 1 ? '' : `translate(${tx}px,${ty}px) scale(${s})`;
  }

  function clampX(){
    tx = Math.min(0, Math.max(tx, innerWidth - innerWidth * s));
  }

  function pdist(a, b){ return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

  // Prevent iOS Safari native gesture zoom
  document.addEventListener('gesturestart',  e => e.preventDefault(), {passive:false});
  document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});

  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      [_s, _tx, _ty] = [s, tx, ty];
      _d  = pdist(e.touches[0], e.touches[1]);
      _mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      _my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      _sy = window.scrollY;
      pan = null;
    } else if (e.touches.length === 1 && s > 1) {
      pan  = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      [_ptx, _pty] = [tx, ty];
    }
  }, {passive: false});

  document.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const d  = pdist(e.touches[0], e.touches[1]);
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const ns = Math.max(1, Math.min(5, _s * d / _d));
      // Body-content coords of the start pinch centre (accounts for scroll)
      const cx = (_mx - _tx) / _s;
      const cy = (_my + _sy - _ty) / _s;
      // Keep that content point under the current pinch centre
      tx = mx - cx * ns;
      ty = my + _sy - cy * ns;
      s  = ns;
      clampX();
      draw(false);
    } else if (e.touches.length === 1 && s > 1 && pan) {
      e.preventDefault();
      tx = _ptx + e.touches[0].clientX - pan.x;
      ty = _pty + e.touches[0].clientY - pan.y;
      clampX();
      draw(false);
    }
  }, {passive: false});

  document.addEventListener('touchend', e => {
    if (e.touches.length < 2) pan = null;
    if (e.touches.length === 1 && s > 1) {
      pan = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      [_ptx, _pty] = [tx, ty];
    }
    if (e.touches.length === 0 && s < 1.08) {
      s = 1; tx = 0; ty = 0;
      draw(true);
    }
  });

  // Double-tap: zoom 2× at tap point, or reset to 1×
  let _dt = 0;
  document.addEventListener('touchend', e => {
    if (e.changedTouches.length !== 1 || e.touches.length !== 0) return;
    const now = Date.now();
    const t   = e.changedTouches[0];
    if (now - _dt < 300) {
      _dt = 0;
      if (s > 1) {
        s = 1; tx = 0; ty = 0; draw(true);
      } else {
        const sy = window.scrollY;
        const cx = (t.clientX - tx) / s;
        const cy = (t.clientY + sy - ty) / s;
        s = 2;
        tx = t.clientX - cx * 2;
        ty = t.clientY + sy - cy * 2;
        clampX();
        draw(true);
      }
    } else {
      _dt = now;
    }
  });
})();

function renderDesktopPane() {

// ===== TTS 朗读引擎 =====
(function initTTS() {
  const synth = window.speechSynthesis;
  if (!synth) return;

  const ttsBar      = document.getElementById('tts-bar');
  const ttsPauseBtn = document.getElementById('tts-pause');
  const ttsStopBtn  = document.getElementById('tts-stop');
  const ttsSpeedBtn = document.getElementById('tts-speed');
  const selSpeakBtn = document.getElementById('sel-speak-btn');

  const SPEEDS = [1, 1.25, 1.5, 0.75];
  let speedIdx = 0, ttsPaused = false, currentText = '';

  function detectLang(text) {
    const thai = (text.match(/[฀-๿]/g) || []).length;
    const cjk  = (text.match(/[一-鿿]/g) || []).length;
    if (thai > cjk && thai > 3) return 'th-TH';
    if (cjk > 0) return 'zh-CN';
    return navigator.language || 'zh-CN';
  }

  // 把 note 对象的所有文字拼成可朗读的字符串
  window.noteToSpeakText = function(n) {
    const parts = [];
    if (n.text) parts.push(plainOf(n.text));
    function addSubs(subs) {
      if (!subs) return;
      subs.forEach(s => { if (s.text) parts.push(plainOf(s.text)); addSubs(s.subs); });
    }
    addSubs(n.subs);
    return parts.filter(Boolean).join('。 ');
  };

  window.ttsSpeak = function(text) {
    if (!text || !text.trim()) return;
    currentText = text.trim();
    synth.cancel();
    const u = new SpeechSynthesisUtterance(currentText);
    u.lang = detectLang(currentText);
    u.rate = SPEEDS[speedIdx];
    u.onend = u.onerror = () => { ttsBar.classList.remove('show'); ttsPaused = false; };
    synth.speak(u);
    ttsPaused = false;
    ttsPauseBtn.textContent = '⏸';
    ttsBar.classList.add('show');
  };

  ttsPauseBtn.addEventListener('click', () => {
    if (ttsPaused) { synth.resume(); ttsPaused = false; ttsPauseBtn.textContent = '⏸'; }
    else           { synth.pause();  ttsPaused = true;  ttsPauseBtn.textContent = '▶'; }
  });

  ttsStopBtn.addEventListener('click', () => {
    synth.cancel(); ttsBar.classList.remove('show'); ttsPaused = false;
  });

  ttsSpeedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    ttsSpeedBtn.textContent = SPEEDS[speedIdx] + '×';
    if (synth.speaking && currentText) window.ttsSpeak(currentText); // 重新开始用新语速
  });

  // ── 划选朗读气泡 ──
  let selTimer = null, selText = '';
  document.addEventListener('selectionchange', () => {
    clearTimeout(selTimer);
    selTimer = setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) { selSpeakBtn.style.display = 'none'; return; }
      const txt = sel.toString().trim();
      if (txt.length < 2) { selSpeakBtn.style.display = 'none'; return; }
      try {
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        if (!rect.width && !rect.height) { selSpeakBtn.style.display = 'none'; return; }
        selText = txt;
        const midX = Math.max(50, Math.min(window.innerWidth - 50, (rect.left + rect.right) / 2));
        const topY = rect.top - 46;
        selSpeakBtn.style.left = midX + 'px';
        selSpeakBtn.style.top  = (topY < 60 ? rect.bottom + 10 : topY) + 'px';
        selSpeakBtn.style.display = 'block';
      } catch { selSpeakBtn.style.display = 'none'; }
    }, 250);
  });

  selSpeakBtn.addEventListener('mousedown', e => e.preventDefault());
  selSpeakBtn.addEventListener('click', () => {
    if (selText) window.ttsSpeak(selText);
    selSpeakBtn.style.display = 'none';
  });
})();

// Initial render of desktop pane on load
if (isDesktopMode()) renderDesktopPane();
</script>

<!-- TTS 朗读控制条 -->
<div id="tts-bar">
  <span class="tts-label">🔊 朗读中…</span>
  <button class="tts-btn" id="tts-pause" title="暂停/继续">⏸</button>
  <button class="tts-btn" id="tts-stop" title="停止">⏹</button>
  <button class="tts-speed" id="tts-speed">1×</button>
</div>
<!-- 划选朗读气泡 -->
<button id="sel-speak-btn">🔊 朗读</button>

</body>
</html>
