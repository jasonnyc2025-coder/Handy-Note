<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>名片夹 · Card Holder</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#ececf1;
    --ink:#1a1a2e; --muted:#6b6b80; --line:#e4e4ec;
    --brand:#4f46e5; --brand-ink:#3d35c9; --brand-soft:rgba(79,70,229,.10);
    --amber:#f59e0b; --danger:#e5484d; --ok:#16a34a;
    --shadow:0 6px 24px rgba(20,20,50,.08);
    --card-shadow:0 10px 30px rgba(20,20,50,.10), 0 2px 6px rgba(20,20,50,.05);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e0e14; --surface:#16161f; --surface-2:#1f1f2b;
      --ink:#ececf2; --muted:#9a9aac; --line:#282836;
      --brand:#818cf8; --brand-ink:#a5b0ff; --brand-soft:rgba(129,140,248,.16);
      --amber:#fbbf24; --danger:#ff6b6f; --ok:#4ade80;
      --shadow:0 6px 24px rgba(0,0,0,.4);
      --card-shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;width:100%;margin:0 auto;padding:0 14px;flex:1;min-height:0;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:16px}

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;z-index:20;background:var(--bg);
    max-width:640px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 8px;
    display:flex;align-items:center;gap:10px;
  }
  .brand-badge{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:22px;flex:0 0 auto;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .title-col{flex:1;min-width:0}
  .title-col h1{font-size:21px;font-weight:800;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
  .title-col h1 .ver{font-size:12px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);
    border-radius:99px;padding:2px 8px}
  .title-col .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
    display:grid;place-items:center;font-size:19px;flex:0 0 auto;box-shadow:var(--shadow)}
  .icon-btn:active{filter:brightness(.92)}

  /* ---------- search + tags ---------- */
  .search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;font-size:16px;color:var(--ink);margin-top:6px;box-shadow:var(--shadow)}
  .search::placeholder{color:var(--muted)}
  .tagbar{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 2px 4px;flex:0 0 auto}
  .tagbar::-webkit-scrollbar{display:none}
  .tagchip{flex:0 0 auto;background:var(--surface-2);color:var(--muted);border-radius:99px;
    padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .tagchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* ---------- card grid ---------- */
  .listwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 120px}
  .listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
  .count{font-size:13px;color:var(--muted)}
  .sort-btn{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);
    border-radius:99px;padding:5px 12px;white-space:nowrap}
  .sort-btn:active{filter:brightness(.9)}
  /* compact contact list: a mini card thumbnail + name/company per row, tap to open */
  .grid{display:flex;flex-direction:column;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
  .tile:active{filter:brightness(.97)}
  .tile-img{width:78px;height:50px;flex:0 0 auto;border-radius:9px;background:var(--surface-2);
    object-fit:cover;display:block;border:1px solid var(--line)}
  .tile-img.ph{display:grid;place-items:center;font-size:22px;color:var(--muted)}
  .tile-main{flex:1 1 auto;min-width:0}
  .tile-name{font-size:16px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-name .star{color:var(--amber)}
  .tile-co{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-tags{display:flex;flex-wrap:nowrap;gap:5px;margin-top:6px;overflow:hidden}
  .tile-tags span{font-size:11px;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:2px 8px;font-weight:600;white-space:nowrap}
  .tile-chev{flex:0 0 auto;color:var(--muted);font-size:22px;line-height:1;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:64px 20px}
  .empty .em-ic{font-size:52px;margin-bottom:12px}
  .empty p{font-size:15px;line-height:1.7}

  /* ---------- FAB ---------- */
  .fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 22px);
    z-index:30;width:62px;height:62px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;
    display:grid;place-items:center;box-shadow:0 10px 26px rgba(79,70,229,.45)}
  .fab:active{transform:translateY(1px)}

  /* ---------- detail overlay ---------- */
  #detailBg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none}
  #detail{position:fixed;inset:0;z-index:51;display:none;flex-direction:column;background:var(--bg)}
  #detailBg.show,#detail.show{display:flex}
  .d-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
  .d-top .grow{flex:1}
  .d-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 40px;max-width:640px;width:100%;margin:0 auto}
  .d-photo{width:100%;border-radius:16px;background:var(--surface-2);display:block;box-shadow:var(--card-shadow);margin-bottom:12px}
  .d-photo.ph{aspect-ratio:16/10;display:grid;place-items:center;font-size:44px;color:var(--muted)}
  .d-name{font-size:26px;font-weight:800;line-height:1.25;margin-top:4px;word-break:break-word}
  .d-title{font-size:16px;color:var(--muted);margin-top:4px}
  .d-co{font-size:18px;font-weight:600;color:var(--brand-ink);margin-top:2px}
  .d-actions{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
  .d-act{flex:1;min-width:74px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:var(--ink);box-shadow:var(--shadow)}
  .d-act .ic{font-size:20px}
  .d-act:active{filter:brightness(.92)}
  .d-field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px}
  .d-field .lb{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
  .d-field a,.d-field .val{font-size:17px;color:var(--ink);text-decoration:none;word-break:break-word;display:block;line-height:1.5}
  .d-field a{color:var(--brand-ink)}
  .d-field .val.note{white-space:pre-wrap}
  .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .d-tags span{font-size:13px;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:4px 11px;font-weight:600}

  /* ---------- edit view ---------- */
  #editView{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column}
  #editView.show{display:flex}
  .e-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 120px;max-width:640px;width:100%;margin:0 auto}
  .photo-row{display:flex;gap:10px;margin-top:6px}
  .photo-slot{flex:1;aspect-ratio:16/10;border:2px dashed var(--line);border-radius:14px;background:var(--surface);
    display:grid;place-items:center;overflow:hidden;position:relative;color:var(--muted);text-align:center;font-size:13px}
  .photo-slot img{width:100%;height:100%;object-fit:cover}
  .photo-slot .ph-in{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
  .photo-slot .ph-in .ic{font-size:26px}
  .photo-slot .clr{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:15px}
  .ocr-hint{font-size:13px;color:var(--muted);margin:10px 2px 0;display:flex;align-items:center;gap:7px;min-height:20px}
  .spin{width:15px;height:15px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .field{margin-top:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
  .field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--ink)}
  .field textarea{min-height:70px;resize:vertical;line-height:1.5}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .e-bar{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--surface);border-top:1px solid var(--line);
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;max-width:640px;margin:0 auto}
  .btn{flex:1;border-radius:14px;padding:15px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
  .btn.ghost{background:var(--surface-2);color:var(--ink);flex:0 0 auto;padding-left:22px;padding-right:22px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn:active{filter:brightness(.93)}
  .view-h{flex:0 0 auto;font-size:20px;font-weight:800;max-width:640px;width:100%;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}

  /* ---------- settings sheet ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none}
  .sheet-bg.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:22px 22px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(100%);transition:.25s;
    max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .sheet.show{transform:translateY(0)}
  .sheet h3{font-size:18px;margin-bottom:4px}
  .sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6}
  .sheet .ghost{width:100%;background:var(--surface-2);color:var(--ink);border-radius:12px;padding:14px;
    font-size:15px;font-weight:600;margin-top:9px;text-align:left;display:flex;align-items:center;gap:10px}
  .sheet .about{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7;text-align:center}

  /* photo-source chooser (拍照 / 相册) */
  .src-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:none}
  .src-bg.show{display:block}
  .src-sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--surface);
    border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(100%);transition:.22s;max-width:640px;margin:0 auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:9px}
  .src-sheet.show{transform:translateY(0)}
  .src-sheet button{background:var(--surface-2);color:var(--ink);border-radius:14px;padding:16px;
    font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
  .src-sheet button .ic{font-size:21px}
  .src-sheet button:active{filter:brightness(.92)}
  .src-sheet .src-cancel{background:transparent;color:var(--muted);font-weight:600;margin-top:2px}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);
    z-index:90;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;
    opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:90vw}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header class="topbar">
  <a class="icon-btn" href="../quick-notes.html" aria-label="返回随手记" title="返回随手记" style="text-decoration:none">←</a>
  <div class="brand-badge">📇</div>
  <div class="title-col">
    <h1>名片夹 <span class="ver" id="appVer">v1</span></h1>
    <div class="sub">Card Holder</div>
  </div>
  <button class="icon-btn" id="gearBtn" aria-label="设置">⚙️</button>
</header>

<div class="wrap">
  <input class="search" id="searchBox" placeholder="🔍 搜索姓名 / 公司 / 电话 / 标签">
  <div class="tagbar" id="tagbar"></div>
  <div class="listwrap">
    <div class="listhead">
      <span class="count" id="count"></span>
      <button class="sort-btn" id="sortBtn">⇅ 姓名</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="em-ic">📇</div>
      <p>还没有名片<br>点右下角 ＋ 拍一张收进来</p>
    </div>
  </div>
</div>

<button class="fab" id="addFab" aria-label="添加名片">＋</button>

<!-- ===== detail ===== -->
<div id="detailBg"></div>
<div id="detail">
  <div class="d-top">
    <button class="icon-btn" id="dBack" aria-label="返回">←</button>
    <div class="grow"></div>
    <button class="icon-btn" id="dStar" aria-label="收藏">☆</button>
    <button class="icon-btn" id="dEdit" aria-label="编辑">✎</button>
    <button class="icon-btn" id="dDel" aria-label="删除">🗑</button>
  </div>
  <div class="d-scroll" id="dScroll"></div>
</div>

<!-- ===== add / edit ===== -->
<div id="editView">
  <div class="view-h" id="editTitle">添加名片</div>
  <div class="e-scroll">
    <div class="photo-row">
      <div class="photo-slot" id="slotFront" data-side="front">
        <div class="ph-in"><span class="ic">📷</span>正面 · 拍照或选相册</div>
      </div>
      <div class="photo-slot" id="slotBack" data-side="back">
        <div class="ph-in"><span class="ic">🔄</span>背面（可选）</div>
      </div>
    </div>
    <div class="ocr-hint" id="ocrHint"></div>

    <div class="field"><label>姓名</label><input id="fName" placeholder=""></div>
    <div class="field"><label>公司 / 机构</label><input id="fCompany" placeholder=""></div>
    <div class="field"><label>职位</label><input id="fTitle" placeholder=""></div>
    <div class="field"><label>电话</label><textarea id="fPhones" placeholder="一行一个"></textarea></div>
    <div class="field"><label>邮箱</label><textarea id="fEmails" placeholder="一行一个"></textarea></div>
    <div class="field"><label>地址</label><textarea id="fAddress" placeholder=""></textarea></div>
    <div class="field"><label>网站</label><input id="fWebsite" placeholder=""></div>
    <div class="field"><label>标签</label><input id="fTags" placeholder="多个用逗号分隔">
      <div class="hint">用来分组浏览</div></div>
    <div class="field"><label>备注</label><textarea id="fNote" placeholder=""></textarea></div>
    <button class="btn danger" id="delBtn" style="display:none;margin-top:20px">🗑 删除这张名片</button>
  </div>
  <div class="e-bar">
    <button class="btn ghost" id="cancelBtn">取消</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</div>

<!-- ===== settings ===== -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>设置与备份</h3>
  <p class="sub">名片文字与缩略图会云同步；原图存在本机并同步到你的服务器。建议定期导出备份。</p>
  <button class="ghost" id="batchBtn">📷 从相册批量导入</button>
  <button class="ghost" id="exportBtn">⬇ 导出备份（含文字，不含原图）</button>
  <button class="ghost" id="importBtn">⬆ 导入备份</button>
  <button class="ghost" id="syncBtn">☁ 立即同步</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <input type="file" id="batchInput" accept="image/*" multiple style="display:none">
  <div class="about" id="aboutBox">名片夹 · 离线优先 PWA</div>
</div>

<!-- camera goes straight to the camera; library lets you pick existing photos -->
<input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="libInput" accept="image/*" style="display:none">

<!-- choose where the photo comes from -->
<div class="src-bg" id="srcBg"></div>
<div class="src-sheet" id="srcSheet">
  <button id="srcCam"><span class="ic">📷</span> 拍照</button>
  <button id="srcLib"><span class="ic">🖼</span> 从相册选择</button>
  <button id="srcCancel" class="src-cancel">取消</button>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const STORE_KEY = "namecards.v1";
const REV_KEY   = "namecards.rev";
const CLOUD_KEY = "quicknotes.cloud";   // shares 随手记's login
const APP_VER   = "v10";

/* ---------------- storage ---------------- */
let cards = [];
function load(){
  try{ cards = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ cards = []; }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(cards)); bumpRev(); scheduleCardsPush(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function getRev(){ return parseInt(localStorage.getItem(REV_KEY),10) || 0; }
function bumpRev(){ const r = Date.now(); localStorage.setItem(REV_KEY, String(r)); return r; }
// only the non-deleted cards
function activeCards(){ return cards.filter(c=>!c._deleted); }
function cardById(id){ return cards.find(c=>c.id===id); }

/* ---------------- IndexedDB (full-res photos, offline cache) ---------------- */
let _db;
function idb(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const rq = indexedDB.open("namecards", 1);
    rq.onupgradeneeded = ()=>{ if(!rq.result.objectStoreNames.contains("images")) rq.result.createObjectStore("images"); };
    rq.onsuccess = ()=>{ _db = rq.result; res(_db); };
    rq.onerror = ()=> rej(rq.error);
  });
}
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("images","readwrite"); tx.objectStore("images").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("images","readonly"); const rq=tx.objectStore("images").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const db=await idb(); return new Promise((res)=>{ const tx=db.transaction("images","readwrite"); tx.objectStore("images").delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
const imgKey = (id,side)=> id + ":" + side;

/* ---------------- image processing ---------------- */
function fileToImage(file){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); });
}
async function downscale(file, maxDim, quality){
  const img = await fileToImage(file);
  const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
  const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  URL.revokeObjectURL(img.src);
  return new Promise(r=> c.toBlob(b=> r(b||file), "image/jpeg", quality));
}
function blobToDataURL(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }

/* ---------------- cloud sync (shares 随手记's login + /api/sync) ---------------- */
function getCloud(){
  try{ const c = JSON.parse(localStorage.getItem(CLOUD_KEY)); return (c && c.token && c.url) ? c : null; }
  catch(e){ return null; }
}
let _pushTimer = null;
function scheduleCardsPush(){ if(!getCloud()) return; clearTimeout(_pushTimer); _pushTimer = setTimeout(cardsPush, 900); }
async function cardsPush(){
  const cloud = getCloud(); if(!cloud) return;
  try{
    let cur = {};
    try{ const g = await fetch(`${cloud.url}/api/sync`, { headers:{ "Authorization":"Bearer "+cloud.token } }); if(g.ok) cur = await g.json(); }catch(e){}
    const body = { cards: cards, cardsRev: getRev() };
    // echo other sections back untouched so we never clobber notes/cats/thai
    if(Array.isArray(cur.notes)) body.notes = cur.notes;
    if(Array.isArray(cur.cats))  body.cats  = cur.cats;
    if(Array.isArray(cur.thai)){ body.thai = cur.thai; body.thaiRev = cur.thaiRev||0; }
    await fetch(`${cloud.url}/api/sync`, {
      method:"PUT",
      headers:{ "Authorization":"Bearer "+cloud.token, "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
async function cardsPull(){
  const cloud = getCloud(); if(!cloud) return;
  try{
    const res = await fetch(`${cloud.url}/api/sync`, { headers:{ "Authorization":"Bearer "+cloud.token } });
    if(!res.ok) return;
    const data = await res.json();
    if(Array.isArray(data.cards) && (data.cardsRev||0) > getRev()){
      cards = data.cards;
      localStorage.setItem(STORE_KEY, JSON.stringify(cards));
      localStorage.setItem(REV_KEY, String(data.cardsRev||0));
      render();
      if($("#detail").classList.contains("show")) { /* keep open card in sync if still there */ }
    }
  }catch(e){}
}
async function cardsSync(){ if(!getCloud()) return; await cardsPull(); cardsPush(); }

// upload a card's full photo to the server (fire-and-forget)
async function uploadImage(id, side, blob){
  const cloud = getCloud(); if(!cloud || !blob) return;
  try{
    const dataUrl = await blobToDataURL(blob);
    await fetch(`${cloud.url}/api/cards/image/${id}?side=${side}`, {
      method:"PUT",
      headers:{ "Authorization":"Bearer "+cloud.token, "Content-Type":"application/json" },
      body: JSON.stringify({ data: dataUrl, mime:"image/jpeg" })
    });
  }catch(e){}
}
// resolve a full photo: local IndexedDB first, else download from server & cache
async function getPhotoURL(card, side){
  const key = imgKey(card.id, side);
  let blob = await idbGet(key).catch(()=>null);
  if(!blob){
    const has = side==="back" ? card.hasBack : card.hasFront;
    const cloud = getCloud();
    if(has && cloud){
      try{
        const r = await fetch(`${cloud.url}/api/cards/image/${card.id}?side=${side}`, { headers:{ "Authorization":"Bearer "+cloud.token } });
        if(r.ok){ blob = await r.blob(); await idbSet(key, blob).catch(()=>{}); }
      }catch(e){}
    }
  }
  return blob ? URL.createObjectURL(blob) : null;
}

/* ---------------- util ---------------- */
function esc(s){ return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),1900); }
function splitLines(s){ return (s||"").split(/[\n,;、，；]+/).map(x=>x.trim()).filter(Boolean); }
function cardTags(c){ return Array.isArray(c.tags)?c.tags:[]; }

/* ---------------- render list ---------------- */
let activeTag = "";   // "" = all
let searchQ = "";
function allTags(){
  const set = new Map();
  activeCards().forEach(c=> cardTags(c).forEach(t=>{ if(t) set.set(t,(set.get(t)||0)+1); }));
  return [...set.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function matches(c){
  if(activeTag && !cardTags(c).includes(activeTag)) return false;
  if(!searchQ) return true;
  const hay = [c.name,c.company,c.title,c.address,c.website,c.note,(c.phones||[]).join(" "),(c.emails||[]).join(" "),cardTags(c).join(" ")].join(" ").toLowerCase();
  return hay.includes(searchQ.toLowerCase());
}
let sortMode = localStorage.getItem("namecards.sort") || "name";   // "name" | "recent"
function sortCards(list){
  const arr = list.slice();
  if(sortMode === "name"){
    return arr.sort((a,b)=>{
      const an=(a.name||"").trim(), bn=(b.name||"").trim();
      if(!an && !bn) return (b.createdAt||0)-(a.createdAt||0);
      if(!an) return 1;                 // unnamed cards sink to the bottom
      if(!bn) return -1;
      return an.localeCompare(bn, undefined, { sensitivity:"base", numeric:true });
    });
  }
  return arr.sort((a,b)=>{
    if(!!b.star !== !!a.star) return (b.star?1:0)-(a.star?1:0);
    return (b.createdAt||0)-(a.createdAt||0);
  });
}
function updateSortBtn(){ const b=$("#sortBtn"); if(b) b.textContent = sortMode==="name" ? "⇅ 姓名" : "⇅ 最近"; }

  $("#sortBtn").style.display = activeCards().length ? "block" : "none";

        ${c.company?`<div class="tile-co">${esc(c.company)}${c.title?" · "+esc(c.title):""}</div>`:(c.title?`<div class="tile-co">${esc(c.title)}</div>`:"")}

function detailAction(act, c){
  if(act==="call") location.href = "tel:"+encodeURIComponent(c.phones[0]);

function buildVCard(c){
  const esc2 = s => (s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const L = ["BEGIN:VCARD","VERSION:3.0"];
  L.push("FN:"+esc2(c.name||""));
  L.push("N:"+esc2(c.name||"")+";;;;");
  if(c.company) L.push("ORG:"+esc2(c.company));
  if(c.title) L.push("TITLE:"+esc2(c.title));
  (c.phones||[]).forEach(p=> L.push("TEL;TYPE=CELL:"+esc2(p)));
  (c.emails||[]).forEach(m=> L.push("EMAIL:"+esc2(m)));
  if(c.address) L.push("ADR;TYPE=WORK:;;"+esc2(c.address)+";;;;");
  if(c.website) L.push("URL:"+esc2(c.website));
  const noteBits = [c.note, cardTags(c).length?("标签: "+cardTags(c).join(", ")):""].filter(Boolean).join("\n");
  if(noteBits) L.push("NOTE:"+esc2(noteBits));
  L.push("END:VCARD");
  return L.join("\r\n");
}
function downloadVCard(c){
  const blob = new Blob([buildVCard(c)],{type:"text/vcard"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=(c.name||"contact")+".vcf"; a.click();
  URL.revokeObjectURL(url);
  toast("已生成 vCard，打开即可存入通讯录");
}

    else { await navigator.clipboard.writeText(text); toast("已复制名片信息"); }
  }catch(e){}
}

async function runOCR(blob){
  const cloud = getCloud();
  const hint = $("#ocrHint");
  if(!cloud){ hint.innerHTML = "💡 登录随手记账号后可自动识别（现在可手动填写）"; return; }
  hint.innerHTML = `<span class="spin"></span> 正在自动识别名片…`;
  try{
    const dataUrl = await blobToDataURL(blob);
    const r = await fetch(`${cloud.url}/api/cards/ocr`, {
      method:"POST",
      headers:{ "Authorization":"Bearer "+cloud.token, "Content-Type":"application/json" },
      body: JSON.stringify({ image: dataUrl })
    });
    if(r.status===501){ hint.innerHTML = "ℹ️ 服务器未配置识别密钥（ANTHROPIC_API_KEY），请手动填写"; return; }
    if(r.status===404){ hint.innerHTML = "⚠️ 服务器还没更新（找不到识别接口，404）——请重新部署服务器后再试"; return; }
    if(!r.ok){
      let msg = "";
      try{ const j = await r.json(); msg = j.message || j.error || ""; }catch(e){}
      hint.innerHTML = `⚠️ 识别失败（${r.status}${msg?" · "+esc(msg):""}），请手动填写`;
      return;
    }
    const j = await r.json();
    const f = j.fields || {};
    fillIfEmpty("#fName", f.name);
    fillIfEmpty("#fCompany", f.company);
    fillIfEmpty("#fTitle", f.title);
    fillIfEmpty("#fPhones", Array.isArray(f.phones)?f.phones.join("\n"):f.phones);
    fillIfEmpty("#fEmails", Array.isArray(f.emails)?f.emails.join("\n"):f.emails);
    fillIfEmpty("#fAddress", f.address);
    fillIfEmpty("#fWebsite", f.website);
    if(f.other) fillIfEmpty("#fNote", f.other);
    hint.innerHTML = "✅ 已自动填写，可再手动修改";
  }catch(e){ hint.innerHTML = "⚠️ 识别失败，请手动填写"; }
}
function fillIfEmpty(sel, val){ const el=$(sel); if(el && !el.value.trim() && val) el.value = val; }

/* ---------------- batch import from album ---------------- */
// run OCR on one image and return the fields object (or null if unavailable)
async function ocrFields(blob){
  const cloud = getCloud(); if(!cloud) return null;
  try{
    const dataUrl = await blobToDataURL(blob);
    const r = await fetch(`${cloud.url}/api/cards/ocr`, {
      method:"POST",
      headers:{ "Authorization":"Bearer "+cloud.token, "Content-Type":"application/json" },
      body: JSON.stringify({ image: dataUrl })
    });
    if(!r.ok) return null;
    const j = await r.json();
    return j.fields || null;
  }catch(e){ return null; }
}
function applyFields(c, f){
  if(!f) return;
  if(f.name) c.name = f.name;
  if(f.company) c.company = f.company;
  if(f.title) c.title = f.title;
  const ph = Array.isArray(f.phones) ? f.phones : splitLines(f.phones);
  if(ph && ph.length) c.phones = ph;
  const em = Array.isArray(f.emails) ? f.emails : splitLines(f.emails);
  if(em && em.length) c.emails = em;
  if(f.address) c.address = f.address;
  if(f.website) c.website = f.website;
  if(f.other) c.note = (c.note ? c.note+"\n" : "") + f.other;
}
// keep a message visible (no auto-hide) while a long job runs
function showProgress(msg){ const t=$("#toast"); clearTimeout(window._tt); t.textContent=msg; t.classList.add("show"); }
// --- duplicate detection for batch import ---
async function sha256Blob(blob){
  try{ const buf = await blob.arrayBuffer(); const h = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ return ""; }
}
function _norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
// a card's identity key from name(+company); empty when there's no name (so
// unnamed cards are never merged together)
function nameKeyOf(c){ const n=_norm(c.name); return n ? n+"|"+_norm(c.company) : ""; }
// one card per selected photo; skip photos already imported (same image or same person)
async function batchImport(fileList){
  const files = [...(fileList||[])]; if(!files.length) return;
  openSheet(false);
  const cloud = getCloud();
  const seenHashes = new Set(activeCards().map(c=>c.imgHash).filter(Boolean));
  const seenNames  = new Set(activeCards().map(nameKeyOf).filter(Boolean));
  let done = 0, ocrOk = 0, skipped = 0;
  for(let i=0;i<files.length;i++){
    showProgress(`正在导入 ${i+1} / ${files.length}…`);
    try{
      const f = files[i];
      const full = await downscale(f, 1600, 0.82);
      const hash = await sha256Blob(full);
      if(hash && seenHashes.has(hash)){ skipped++; continue; }   // exact same photo already in
      const now = Date.now();
      const c = { id: uid(), createdAt: now, modified: now, day: todayStr(), hasFront: true, phones:[], emails:[], tags:[] };
      if(cloud){ const fields = await ocrFields(full); if(fields){ applyFields(c, fields); ocrOk++; } }
      const nk = nameKeyOf(c);
      if(nk && seenNames.has(nk)){ skipped++; continue; }        // same person already in
      const thumbBlob = await downscale(f, 460, 0.7);
      c.thumb = await blobToDataURL(thumbBlob);
      c.imgHash = hash;
      await idbSet(imgKey(c.id, "front"), full).catch(()=>{});
      cards.push(c);
      uploadImage(c.id, "front", full);
      if(hash) seenHashes.add(hash);
      if(nk) seenNames.add(nk);
      done++;
      save(); render();
    }catch(e){}
  }
  const bits = [`已导入 ${done} 张`];
  if(skipped) bits.push(`跳过 ${skipped} 张重复`);
  if(ocrOk) bits.push(`识别 ${ocrOk} 张`);
  toast(bits.join(" · "));
}

$("#batchInput").onchange = e=>{ const fs = [...e.target.files]; e.target.value=""; batchImport(fs); };

// soft-delete a card (tombstone syncs the deletion) and drop its photos locally + on the server
function removeCard(id){
  const c = cardById(id); if(!c) return;
  c._deleted = true; c._deletedAt = Date.now(); c.modified = Date.now();
  idbDel(imgKey(id,"front")); idbDel(imgKey(id,"back"));
  const cloud = getCloud();
  if(cloud){ fetch(`${cloud.url}/api/cards/image/${id}`,{ method:"DELETE", headers:{ Authorization:"Bearer "+cloud.token } }).catch(()=>{}); }
  save();
}
function confirmDelete(id){
  const c = cardById(id); if(!c) return;
  const label = (c.name||c.company||"").trim();
  if(!confirm(label ? `删除「${label}」？` : "确定删除这张名片？")) return;
  removeCard(id);
  $("#editView").classList.remove("show"); closeDetail(); render();
  toast("已删除");
}
$("#delBtn").onclick = ()=>{ if(editId) confirmDelete(editId); };
$("#dDel").onclick = ()=>{ if(detailId) confirmDelete(detailId); };
$("#saveBtn").onclick = async ()=>{
  const now = Date.now();
  let c = editId ? cardById(editId) : null;
  const isNew = !c;
  if(isNew){ c = { id: uid(), createdAt: now, day: todayStr() }; cards.push(c); }
  c.name    = $("#fName").value.trim();
  c.company = $("#fCompany").value.trim();
  c.title   = $("#fTitle").value.trim();
  c.phones  = splitLines($("#fPhones").value);
  c.emails  = splitLines($("#fEmails").value);
  c.address = $("#fAddress").value.trim();
  c.website = $("#fWebsite").value.trim();
  c.tags    = splitLines($("#fTags").value);
  c.note    = $("#fNote").value.trim();
  c.modified = now;
  // apply photo changes
  for(const side of ["front","back"]){
    const p = pendingImg[side];
    if(!p) continue;
    if(p.cleared){
      await idbDel(imgKey(c.id,side));
      if(side==="front") c.hasFront=false; else c.hasBack=false;
      const cloud=getCloud(); if(cloud){ /* leave server copy; overwritten next upload */ }
    }else if(p.blob){
      await idbSet(imgKey(c.id,side), p.blob).catch(()=>{});
      if(side==="front"){ c.hasFront=true; c.thumb = p.thumb; } else c.hasBack=true;
      uploadImage(c.id, side, p.blob);
    }
  }
  if(editThumb===null && (pendingImg.front && pendingImg.front.cleared)) c.thumb = null;
  save();
  $("#editView").classList.remove("show");
  render();
  toast(isNew ? "已收录名片" : "已保存");
  if(!isNew && detailId===c.id) openDetail(c.id);
};

/* ---------------- settings / backup ---------------- */
function openSheet(v){ $("#sheet").classList.toggle("show",v); $("#sheetBg").classList.toggle("show",v);
  if(v){ const cl=getCloud(); $("#aboutBox").innerHTML = `名片夹 ${APP_VER} · 离线优先 PWA<br>${cl?"☁ 云同步已开启":"未登录（在随手记登录后自动同步）"}`; } }
$("#gearBtn").onclick = ()=> openSheet(true);
$("#sheetBg").onclick = ()=> openSheet(false);
$("#syncBtn").onclick = ()=>{ if(!getCloud()){ toast("请先在随手记里登录"); return; } cardsSync(); toast("正在同步…"); openSheet(false); };
$("#exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(activeCards(),null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=`namecards-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast(`已导出 ${activeCards().length} 张（文字）`);
};
$("#importBtn").onclick = ()=> $("#importFile").click();
$("#importFile").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      let added=0;
      data.forEach(d=>{
        d.id = d.id || uid();
        if(!cards.some(c=>c.id===d.id)){ cards.push({ createdAt:Date.now(), day:todayStr(), ...d }); added++; }
      });
      save(); render(); toast(`导入 ${added} 张`); openSheet(false);
    }catch(err){ toast("文件格式不正确"); }
  };
  r.readAsText(f); e.target.value="";
};

/* ---------------- boot ---------------- */
const _av = $("#appVer"); if(_av) _av.textContent = APP_VER;
load();
render();
cardsSync();
setInterval(cardsPull, 20000);

/* ---------------- auto-update ----------------
   Each release bumps the SW cache name; sw.js calls skipWaiting()+clients.claim(),
   so the new worker takes control and fires 'controllerchange' — we reload then. */
if("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let _didReload = false;
  function _applyUpdate(){
    if(_didReload) return; _didReload = true;
    try{ toast("正在更新到新版…"); }catch(e){}
    setTimeout(()=>location.reload(), 600);
  }
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController) _applyUpdate(); });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
    }).catch(()=>{});
  });
}
</script>
