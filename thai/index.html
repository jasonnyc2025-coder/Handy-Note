<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d9488">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>泰语卡片 · Thai Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1f0;
    --card-bg:#ffffff; --card-ex-bg:#eef4f2;   /* white flashcard, soft grey example chips (light) */
    --home-card-bg:#e6f4f0; --home-card-line:#bfe3da;   /* teal-tinted preview card, set apart from the white list */
    --teal-soft:rgba(13,148,136,.12);                   /* active-tab pill */
    --note-bg:#fdf6e9; --note-line:#f0e2c4; --amber-ink:#a15c0a;   /* 备注 card (light) */
    --card-shadow:0 10px 30px rgba(18,32,30,.10), 0 2px 6px rgba(18,32,30,.05);
    --ink:#12201e; --muted:#6b7a77; --line:#e2e7e5; --field-line:#b9c6c2;
    --teal:#0d9488; --teal-ink:#0a6f66; --amber:#f59e0b;
    --again:#e5484d; --hard:#f5a623; --good:#0d9488; --easy:#3b82f6;
    --shadow:0 6px 24px rgba(18,32,30,.08);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0c1413; --surface:#141d1b; --surface-2:#1c2725;
      --card-bg:#141d1b; --card-ex-bg:#1c2725;   /* dark unchanged */
      --home-card-bg:#123a34; --home-card-line:#1f5148;
      --teal-soft:rgba(45,212,191,.16);
      --note-bg:#2a2416; --note-line:#3d3420; --amber-ink:#fbbf24;
      --ink:#eef2f1; --muted:#8a9a97; --line:#26332f; --field-line:#43584f;
      --teal:#2dd4bf; --teal-ink:#5eead4; --amber:#fbbf24;
      --shadow:0 6px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .thai{font-family:"Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif}
  .wrap{max-width:600px;width:100%;margin:0 auto;padding:0 16px;flex:1;min-height:0;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  }
  .topbar .inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .title-center{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
  .logo{
    width:34px;height:34px;border-radius:10px;background:var(--teal);flex:0 0 auto;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;
  }
  .logo .thai{line-height:1}
  .title{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .title small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .topbar .spacer{flex:1}
  .icon-btn{
    width:46px;height:46px;border-radius:13px;background:var(--surface);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--ink);font-size:22px;flex:0 0 auto;
  }
  .icon-btn:active{background:var(--surface-2)}

  /* ---------- views ---------- */
  .view{display:none;animation:fade .2s ease}
  .view.active{display:flex;flex-direction:column;flex:1;min-height:0}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- home ---------- */
  .hero{
    background:linear-gradient(135deg,var(--teal),var(--teal-ink));
    border-radius:var(--radius);padding:22px;color:#fff;box-shadow:var(--shadow);margin-top:6px;
  }
  .hero h2{font-size:15px;font-weight:600;opacity:.9}
  .hero .big{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0 2px}
  .hero .big span{font-size:18px;font-weight:600;opacity:.8}
  .hero p{font-size:13px;opacity:.85;margin-top:4px}
  .cta{
    width:100%;margin-top:18px;background:#fff;color:var(--teal-ink);border-radius:13px;
    padding:15px;font-size:16px;font-weight:700;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .cta:active{transform:translateY(1px)}
  .cta:disabled{opacity:.55}

  .stats{display:flex;gap:12px;margin-top:14px}
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px;text-align:center;
  }
  .stat b{display:block;font-size:24px;font-weight:800;color:var(--teal-ink)}
  .stat span{font-size:12px;color:var(--muted)}

  .section-h{font-size:13px;font-weight:700;color:var(--muted);margin:22px 4px 10px;letter-spacing:.02em;text-transform:uppercase}

  /* home: fixed card area on top + scrollable word list below */
  .home-due-row{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-top:8px}
  .home-due-text{font-size:16px;font-weight:600}
  .home-due-text b{font-size:24px;color:var(--teal-ink);font-weight:800;margin-right:3px}
  /* big primary "start review" button pinned to the bottom of the home view */
  .home-start-cta{
    flex:0 0 auto;width:100%;margin:12px 0 4px;
    background:var(--teal);color:#04201c;border-radius:16px;
    padding:18px;font-size:19px;font-weight:800;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 8px 20px rgba(13,148,136,.28);
  }
  .home-start-cta:active{transform:translateY(1px)}
  .home-start-cta:disabled{opacity:.5;box-shadow:none}
  /* "continue last review" — shown only when an unfinished session exists;
     amber so it clearly reads as "resume", distinct from the teal start CTA */
  .home-continue-cta{
    flex:0 0 auto;width:100%;margin:12px 0 0;
    background:var(--surface);color:var(--text);
    border:2px solid #f0b429;border-radius:16px;
    padding:15px;font-size:17px;font-weight:800;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 16px rgba(240,180,41,.20);
  }
  .home-continue-cta b{color:#c47a00;padding:0 2px}
  .home-continue-cta:active{transform:translateY(1px)}
  @media(prefers-color-scheme:dark){ .home-continue-cta b{color:#f0c14b} }
  /* home preview card is teal-tinted so it clearly reads as "the card",
     distinct from the plain white word rows scrolling beneath it */
  .card.home-card{align-self:stretch;flex:0 0 auto;min-height:150px;max-height:min(38vh,320px);margin-top:12px;padding:18px;
    background:var(--home-card-bg);border-color:var(--home-card-line)}
  .home-card .card-thai{font-size:38px}
  .home-card .card-spk{margin-top:10px;width:46px;height:46px;font-size:20px;background:var(--surface);border-color:var(--home-card-line)}
  .home-card .card-back{margin-top:14px;padding-top:14px;border-top-color:var(--home-card-line)}
  .home-card .cb-ex{background:var(--surface)}   /* white chips pop on the tinted card */
  .home-card .tap-hint{font-size:11px}
  .home-list-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .home-list-wrap .section-h{flex:0 0 auto;margin:16px 4px 8px}
  #homeRecent{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
  .witem{cursor:pointer}
  .witem.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
  /* list tab: search fixed, list scrolls */
  #view-list .search{flex:0 0 auto}
  #wordList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:14px}
  /* add tab: whole form scrolls */
  #view-add{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}

  /* ---------- word list ---------- */
  .search{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:12px 14px;font-size:15px;color:var(--ink);margin-top:6px;
  }
  .search:focus{outline:none;border-color:var(--teal)}
  /* search box with a one-tap clear (✕) at its right edge */
  .search-wrap{position:relative;margin-top:6px}
  #view-list .search-wrap{flex:0 0 auto}
  .search-wrap .search{margin-top:0;padding-right:44px}
  .search-clear{position:absolute;top:0;bottom:0;right:7px;margin:auto 0;
    width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--muted);
    display:grid;place-items:center;font-size:14px;line-height:1}
  .search-clear:active{filter:brightness(.9)}
  .wlist{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .witem{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px;
    display:flex;align-items:center;gap:12px;min-width:0;
  }
  .witem .w-thai{font-size:22px;font-weight:600;line-height:1.35;flex:0 1 auto;min-width:0;overflow-wrap:break-word}
  /* basis 0 so the (ellipsized) meaning/reading can't inflate the body and
     squeeze the Thai column; min-width keeps the meaning readable */
  .witem .w-body{flex:1 1 0;min-width:96px}
  .witem .w-mean{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* reading may hold a long note; keep it to one ellipsized line so it can't
     collapse into a one-character column and shove the row buttons around */
  .witem .w-read{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .witem .w-actions{display:flex;gap:6px;flex:0 0 auto}
  .mini{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:15px;color:var(--muted)}
  .mini:active{background:var(--line)}
  .mini.spk{color:var(--teal-ink)}

  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .em-ic{font-size:44px;opacity:.5}
  .empty p{margin-top:10px;font-size:14px;line-height:1.6}

  /* ---------- forms ---------- */
  .field{margin-top:18px}
  .field label{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:.01em}
  .field label .opt{font-size:12px;font-weight:500;color:var(--muted)}
  .field input,.field textarea{
    width:100%;background:var(--surface);border:1.5px solid var(--field-line);border-radius:12px;
    padding:14px 14px;font-size:16px;color:var(--ink);
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .field textarea{min-height:70px;resize:vertical;line-height:1.5}
  .field .with-spk{position:relative}
  .field .with-spk .mini{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
  /* the "添加生词 / 编辑生词" screen title */
  #view-add .section-h{font-size:19px;font-weight:800;color:var(--ink);text-transform:none;letter-spacing:0;margin:10px 4px 4px}
  /* example rows */
  .ex-row{background:var(--surface-2);border:1.5px solid var(--field-line);border-radius:14px;padding:14px;margin-top:12px}
  .ex-row-head{display:flex;justify-content:flex-start;gap:8px;align-items:center;margin-bottom:10px}
  .ex-row-head span{font-size:13px;font-weight:700;color:var(--ink)}
  .ex-row-head .mini{width:28px;height:28px;font-size:13px;background:var(--surface)}
  .ex-row .with-spk{position:relative}
  .ex-row .with-spk .mini{position:absolute;right:8px;top:14px}
  .ex-row textarea{width:100%;background:var(--surface);border:1.5px solid var(--field-line);border-radius:11px;padding:14px 46px 14px 14px;font-size:16px;color:var(--ink);min-height:72px;resize:vertical;line-height:1.5}
  .ex-row .ex-mean-in{width:100%;margin-top:12px;background:var(--surface);border:1.5px solid var(--field-line);border-radius:11px;padding:14px 14px;font-size:16px;color:var(--ink)}
  .ex-row textarea:focus,.ex-row .ex-mean-in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .primary{
    width:100%;margin-top:22px;background:var(--teal);color:#fff;border-radius:13px;
    padding:15px;font-size:16px;font-weight:700;letter-spacing:.02em;
  }
  .primary:active{transform:translateY(1px)}
  .primary:disabled{opacity:.5}
  .ghost{
    width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    border-radius:13px;padding:13px;font-size:14px;font-weight:600;
  }
  .form-msg{text-align:center;font-size:13px;color:var(--teal-ink);margin-top:12px;min-height:18px}
  .field-missing{border-color:#e5533d !important;box-shadow:0 0 0 3px rgba(229,83,61,.28) !important;animation:missingPulse .4s ease}
  @keyframes missingPulse{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* ---------- review ---------- */
  .review-screen{
    position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .review-screen.active{display:flex}
  .rv-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  /* exit-review button, moved to the bottom, enlarged with a small accent chip */
  .rv-exit{
    align-self:center;margin-top:14px;flex:0 0 auto;
    display:inline-flex;align-items:center;gap:9px;
    padding:13px 30px;border-radius:99px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    color:var(--muted);font-size:16px;font-weight:600;letter-spacing:.02em;
  }
  .rv-exit .ic{
    width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-2);color:var(--teal-ink);font-size:13px;font-weight:800;line-height:1;
  }
  .rv-exit:active{transform:translateY(1px);filter:brightness(.97)}
  /* footer row: exit stays centered, edit sits in the bottom-right corner */
  .rv-footer{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;margin-top:14px}
  .rv-footer .rv-exit{margin-top:0}
  .rv-edit{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:48px;height:48px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--teal-ink);
  }
  .rv-edit:active{transform:translateY(-50%) scale(.92)}
  .rv-progress{flex:1}
  .rv-count{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .rv-count b{color:var(--ink);font-weight:700}
  .bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .28s ease;border-radius:99px}
  .rv-tally{display:flex;gap:6px;margin-top:8px}
  .tally{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 4px;color:var(--muted);
  }
  .tally .dot{width:8px;height:8px;border-radius:99px}
  .tally b{color:var(--ink);font-variant-numeric:tabular-nums}
  .dot.again{background:var(--again)} .dot.hard{background:var(--hard)}
  .dot.good{background:var(--good)} .dot.easy{background:var(--easy)}

  /* prev/next arrows flanking the card, vertically centered */
  .rv-arrow{
    position:absolute;top:37%;transform:translateY(-50%);z-index:5;
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    color:var(--ink);font-size:24px;font-weight:600;line-height:1;
  }
  .rv-arrow-prev{left:2px}
  .rv-arrow-next{right:2px}
  .rv-arrow:active{filter:brightness(.85)}
  .rv-arrow:disabled{opacity:.3;pointer-events:none}
  .rv-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0;min-height:0}
  .card{
    width:100%;max-width:460px;background:var(--card-bg);
    align-self:stretch;min-height:0;max-height:100%;          /* fill the space, never push past the buttons */
    overflow:hidden;                                          /* card itself stays put; only the examples scroll */
    border:1px solid var(--line);border-radius:24px;box-shadow:var(--card-shadow);
    padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;cursor:pointer;
  }
  .card .tap-hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:var(--muted);letter-spacing:.04em}
  /* Thai stacks vowel/tone marks above & below the base letters, so a tight
     line-height makes wrapped lines collide — give it generous leading */
  .card-thai{font-size:52px;font-weight:600;line-height:1.42;word-break:break-word}
  .card-spk{
    margin-top:18px;width:56px;height:56px;border-radius:99px;background:var(--surface-2);
    display:grid;place-items:center;font-size:24px;color:var(--teal-ink);border:1px solid var(--line);
  }
  .card-spk:active{background:var(--teal);color:#fff}
  .card-back{width:100%;border-top:1px solid var(--line);margin-top:22px;padding-top:20px;display:none}
  /* when revealed, fill the remaining card height so only the examples scroll */
  .card-back.show{display:flex;flex-direction:column;flex:1;min-height:0;animation:fade .18s ease}
  .cb-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%}
  .cb-exlist{width:100%}
  .cb-mean{font-size:24px;font-weight:700;line-height:1.4;color:var(--teal-ink)}
  .cb-read{font-size:15px;color:var(--muted);margin-top:6px}
  /* 备注 block: a soft amber note card, shown only when there's a note */
  .cb-note{display:none;margin-top:18px;background:var(--note-bg);border:1px solid var(--note-line);
    border-left:3px solid var(--amber);border-radius:14px;padding:12px 14px;text-align:left;
    font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cb-note::before{content:"备注";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
    color:var(--amber-ink);margin-bottom:6px;text-transform:uppercase}
  .cb-exlist::before{content:"例句";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
    color:var(--muted);text-align:left;margin:20px 2px 2px;text-transform:uppercase}
  .cb-exlist:empty::before{display:none}
  .cb-ex{margin-top:12px;background:var(--card-ex-bg);border:1px solid var(--line);border-left:3px solid var(--teal);
    border-radius:14px;padding:14px 14px;text-align:left}
  .cb-ex .ex-thai{font-size:28px;font-weight:500;line-height:1.55;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  .cb-ex .ex-thai .mini{flex:0 0 auto;margin-top:2px}
  .cb-ex .ex-mean{font-size:18px;color:var(--muted);margin-top:8px;line-height:1.5}
  /* two alternating highlight colors so two touching highlighted words
     (common in spaceless Thai) don't merge into one blob.
     hl-a = amber, hl-b = soft violet — kept away from the app's teal/green
     theme so a highlight never blends into the accent color */
  mark.hl{border-radius:5px;padding:0 3px}
  mark.hl-a{background:#ffe08a;color:#5a4200}
  mark.hl-b{background:#e0d4fb;color:#4a2a86}
  @media(prefers-color-scheme:dark){
    mark.hl-a{background:#8a6a1f;color:#ffe9b0}
    mark.hl-b{background:#4a3a7c;color:#e7ddff}
  }
  /* floating popup shown when text is selected inside an example */
  /* fixed near the bottom (above the action buttons) so it never clashes with
     the OS text-selection menu, which appears next to the selection up top */
  #selPop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
    z-index:80;display:none;gap:6px;background:var(--ink);border-radius:13px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  #selPop.show{display:flex}
  #selPop button{background:rgba(255,255,255,.14);color:var(--bg);border-radius:9px;padding:9px 13px;font-size:14px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;min-height:40px}
  #selPop #selSpeak{font-size:20px;padding-left:24px;padding-right:24px}   /* icon-only: enlarge so it matches the 高亮 button */
  #selPop button:active{background:rgba(255,255,255,.28)}
  /* "peek at this word" read-only overlay — sits above the review screen */
  #peekBg{position:fixed;inset:0;z-index:88;background:rgba(0,0,0,.5);display:none}

  #peekBg.show,#peekPanel.show{display:flex}
  /* close button pinned to the bottom of the screen — easy thumb reach */
  #peekClose{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:90;
    background:var(--surface);color:var(--ink);cursor:pointer;
    border:1px solid var(--line);border-radius:99px;padding:15px 40px;font-size:16px;font-weight:800;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #peekClose:active{transform:translateX(-50%) translateY(1px);filter:brightness(.9)}
  .peek-card{cursor:default;align-self:center;max-height:74vh}
  .peek-card .peek-body{width:100%;display:flex;flex-direction:column;flex:1;min-height:0;
    border-top:1px solid var(--line);margin-top:20px;padding-top:18px}

  .rv-actions{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .rv-actions.show{display:grid}
  .rate{
    border-radius:13px;padding:13px 4px 10px;color:#fff;font-size:15px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .rate small{font-size:10px;font-weight:500;opacity:.85}
  .rate:active{transform:translateY(1px);filter:brightness(.95)}
  .rate.again{background:var(--again)} .rate.hard{background:var(--hard)}
  .rate.good{background:var(--good)} .rate.easy{background:var(--easy)}
  .reveal-btn{
    display:block;width:100%;margin-top:12px;background:var(--teal);color:#fff;
    border-radius:13px;padding:15px;font-size:16px;font-weight:700;
  }
  .reveal-btn.hide{display:none}

  /* session done */
  .done{text-align:center;padding:30px 16px}
  .done .big-ic{font-size:64px}
  .done h2{font-size:24px;font-weight:800;margin-top:10px}
  .done p{color:var(--muted);margin-top:6px}
  .done .summary{display:flex;gap:8px;margin:22px 0}

  /* ---------- bottom nav ---------- */
  /* soft recessed bar; the three buttons sit as raised chips that "pop out" */
  .nav{
    flex:0 0 auto;z-index:30;background:var(--surface-2);
    display:flex;gap:10px;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    box-shadow:inset 0 1px 0 rgba(18,32,30,.05), 0 -8px 24px rgba(18,32,30,.05);
  }
  .nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--muted);
    padding:15px 0;border-radius:18px;
    background:var(--surface);
    box-shadow:0 3px 10px rgba(18,32,30,.08);
    transition:transform .16s ease, background .16s ease, box-shadow .16s ease, color .16s ease;
  }
  .nav button .ic{font-size:25px;line-height:1;transition:transform .16s ease}
  .nav button.on{color:var(--teal-ink);background:var(--teal-soft);box-shadow:0 4px 14px rgba(13,148,136,.16)}
  .nav button.on .ic{transform:translateY(-1px)}
  .nav button:active{transform:translateY(1px) scale(.98)}

  /* ---------- sheet (settings) ---------- */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none}
  .sheet-bg.show{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
    border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s ease;max-width:600px;margin:0 auto;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;
    z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;

</style>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const STORE_KEY = "thaicards.v1";
const APP_VER = "v44";   // shown in the top bar; bump with each release

/* ---------------- storage ---------------- */
let cards = [];
function load(){
  try{ cards = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ cards = []; }
  // migrate old single-example fields -> examples array
  let migrated = false;
  cards.forEach(c=>{
    if(!Array.isArray(c.examples)){
      c.examples = c.example ? [{ thai:c.example, meaning:c.exampleMeaning||"" }] : [];
      migrated = true;
    }
    delete c.example; delete c.exampleMeaning;
  });
  if(migrated) save();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(cards)); bumpThaiRev(); scheduleThaiPush(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

/* ---------------- speech ---------------- */
let thaiVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  thaiVoice = vs.find(v=>/th(-|_)?/i.test(v.lang)) || vs.find(v=>/thai/i.test(v.name)) || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!text) return;
  if(!("speechSynthesis" in window)){ toast("此浏览器不支持语音"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "th-TH";
  if(thaiVoice) u.voice = thaiVoice;
  u.rate = 0.9;
  u.onerror = ()=>{};
  speechSynthesis.speak(u);
  if(!thaiVoice){
    // hint once — device may lack a Thai voice
    if(!speak._warned){ toast("未检测到泰语语音，请在系统里安装"); speak._warned=true; }
  }
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900);
}

/* ---------------- navigation ---------------- */
function showTab(tab){
  $$(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+tab).classList.add("active");
  $$(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if(tab==="home") renderHome();
  if(tab==="list") renderList();
  if(tab==="add" && !editingId) resetForm();
  window.scrollTo(0,0);
}
$$(".nav button").forEach(b=> b.onclick=()=>{ editReturnToReview=false; showTab(b.dataset.tab); });

/* ---------------- home ---------------- */
let homeCardId = null, homeRevealed = false, homeUserPicked = false;
function renderHome(){
  $("#homeDue").textContent = cards.length;
  $("#startReview").disabled = cards.length===0;
  refreshContinueCta();
  const list = [...cards].reverse();          // newest first, all words (scrollable)
  const box = $("#homeRecent");
  if(list.length===0){
    box.innerHTML = `<div class="empty"><div class="em-ic">📝</div><p>还没有生词<br>去「添加」录入第一个吧</p></div>`;
    homeCardId = null; homeUserPicked = false;
    $("#homeCardThai").textContent = "—";
    $("#homeCardBack").classList.remove("show");
    $("#homeTapHint").style.display = "none";
    return;
  }
  box.innerHTML = list.map(wordItemHTML).join("");
  bindWordItems(box);
  // tap a word (not its action buttons) -> pick it: preview on top + review starts here
  box.querySelectorAll(".witem").forEach(el=>{
    el.addEventListener("click", e=>{ if(e.target.closest("button")) return; selectHomeCard(el.dataset.id, true); });
  });
  // keep the current selection if it still exists, else just preview the newest (not a user pick)
  const keep = homeCardId && list.some(c=>c.id===homeCardId);
  selectHomeCard(keep ? homeCardId : list[0].id, keep ? homeUserPicked : false);
}
// userPicked=true when the user tapped the word (review will start from it & the row is highlighted);
// false = just a preview of the newest card on load.
function selectHomeCard(id, userPicked){
  const c = cards.find(x=>x.id===id);
  if(!c) return;
  homeCardId = id; homeRevealed = false; homeUserPicked = !!userPicked;
  $("#homeCardThai").textContent = c.thai;
  $("#homeCbMean").textContent = c.meaning || "";
  $("#homeCbRead").textContent = c.reading || "";
  renderNote($("#homeCbNote"), c.note);
  renderCardExamples($("#homeCbExList"), c.examples || [], c.id);
  $("#homeCardBack").classList.remove("show");
  $("#homeTapHint").style.display = "block";
  document.querySelectorAll("#homeRecent .witem").forEach(el=> el.classList.toggle("sel", homeUserPicked && el.dataset.id===id));
}
function homeFlip(){
  if(!homeCardId) return;
  homeRevealed = !homeRevealed;
  $("#homeCardBack").classList.toggle("show", homeRevealed);
  $("#homeTapHint").style.display = homeRevealed ? "none" : "block";
}
$("#homeCard").onclick = e=>{ if(e.target.closest("button")) return; if(window.getSelection && String(window.getSelection()).trim()) return; homeFlip(); };
$("#homeCardSpk").onclick = e=>{ e.stopPropagation(); const c=cards.find(x=>x.id===homeCardId); if(c) speak(c.thai); };

/* ---------------- word list ---------------- */
function wordItemHTML(c){
  return `<div class="witem" data-id="${c.id}">
    <div class="w-thai thai">${esc(c.thai)}</div>
    <div class="w-body">
      <div class="w-mean">${esc(c.meaning||"—")}</div>
      ${c.reading?`<div class="w-read">${esc(c.reading)}</div>`:""}
    </div>
    <div class="w-actions">
      <button class="mini spk" data-act="speak" aria-label="发音">🔊</button>
      <button class="mini" data-act="edit" aria-label="编辑">✎</button>
      <button class="mini" data-act="del" aria-label="删除">🗑</button>
    </div>
  </div>`;
}
function bindWordItems(scope){
  scope.querySelectorAll(".witem").forEach(el=>{
    const id = el.dataset.id;
    el.querySelector('[data-act="speak"]').onclick = e=>{ e.stopPropagation(); const c=cards.find(x=>x.id===id); if(c) speak(c.thai); };
    el.querySelector('[data-act="edit"]').onclick = e=>{ e.stopPropagation(); startEdit(id); };
    el.querySelector('[data-act="del"]').onclick = e=>{ e.stopPropagation(); delCard(id); };
    // tap the row (not its action buttons) -> peek at the full read-only card
    el.addEventListener("click", e=>{ if(e.target.closest("button")) return; const c=cards.find(x=>x.id===id); if(c) openPeek(c); });
  });
}
// everything searchable on a card: word, meaning, reading, note, and every
// example's Thai + Chinese — so typing a word from an example or note finds it
function cardHaystack(c){
  const parts = [c.thai, c.meaning, c.reading, c.note];
  (c.examples||[]).forEach(e=>{ if(e){ parts.push(e.thai); parts.push(e.meaning); } });
  return parts.filter(Boolean).join(" ").toLowerCase();
}
function renderList(){
  const q = $("#searchBox").value.trim().toLowerCase();
  const box = $("#wordList");
  toggleSearchClear();
  let list = [...cards].reverse();
  if(q) list = list.filter(c => cardHaystack(c).includes(q));
  if(list.length===0){
    box.innerHTML = `<div class="empty"><div class="em-ic">${q?"🔍":"📚"}</div><p>${q?"没有匹配的生词":"生词本还是空的<br>去「添加」录入第一个吧"}</p></div>`;
    return;
  }
  box.innerHTML = list.map(wordItemHTML).join("");
  bindWordItems(box);
}
function toggleSearchClear(){ const b=$("#searchClear"); if(b) b.style.display = $("#searchBox").value ? "grid" : "none"; }
$("#searchBox").addEventListener("input", ()=>{ toggleSearchClear(); renderList(); });
$("#searchClear").onclick = ()=>{ const s=$("#searchBox"); s.value=""; toggleSearchClear(); renderList(); s.focus(); };

function delCard(id){
  const c = cards.find(x=>x.id===id);
  if(!c) return;
  if(!confirm(`删除「${c.thai}」？`)) return;
  cards = cards.filter(x=>x.id!==id);
  save(); renderList(); renderHome(); toast("已删除");
}

let editingId = null;

// dynamic example rows
function addExRow(thai="", meaning="", listEl){
  listEl = listEl || $("#exList");
  const row = document.createElement("div");
  row.className = "ex-row";
  row.innerHTML = `
    <div class="ex-row-head"><button class="mini" data-act="rmEx" aria-label="删除例句">✕</button><span></span></div>
    <div class="with-spk">
      <textarea class="thai ex-thai-in" placeholder="在此输入泰文例句…"></textarea>
      <button class="mini spk" data-act="exSpk" aria-label="例句发音">🔊</button>
    </div>
    <input class="ex-mean-in" placeholder="这句话的中文翻译（选填）" autocomplete="off">`;
  row.querySelector(".ex-thai-in").value = thai;
  row.querySelector(".ex-mean-in").value = meaning;
  row.querySelector('[data-act="rmEx"]').onclick = ()=>{ row.remove(); renumberEx(listEl); };
  row.querySelector('[data-act="exSpk"]').onclick = ()=> speak(row.querySelector(".ex-thai-in").value.trim());
  listEl.appendChild(row);
  renumberEx(listEl);
}
function renumberEx(listEl){
  (listEl||$("#exList")).querySelectorAll(".ex-row").forEach((r,i)=>{
    r.querySelector(".ex-row-head span").textContent = "例句 "+(i+1);
  });
}
function collectExamples(listEl){
  const out = [];
  (listEl||$("#exList")).querySelectorAll(".ex-row").forEach(r=>{
    const t = r.querySelector(".ex-thai-in").value.trim();
    const m = r.querySelector(".ex-mean-in").value.trim();
    if(t) out.push({ thai:t, meaning:m });
  });
  return out;
}
function setExamples(list, listEl){
  listEl = listEl || $("#exList");
  listEl.innerHTML = "";
  if(list && list.length){ list.forEach(e=>addExRow(e.thai||"", e.meaning||"", listEl)); }
  else { addExRow("", "", listEl); }   // start with one empty row
}
$("#addExBtn").onclick = ()=> addExRow();

// When editing was launched from the review screen (the ✎ corner button),
// saving/cancelling should drop the user back into the review, not the list.
let editReturnToReview = false;
let _reviewWasRevealed = false;
function returnToReviewIfNeeded(){
  if(!editReturnToReview) return false;
  editReturnToReview = false;
  resetForm();
  $("#reviewScreen").classList.add("active");
  renderReviewCard();
  if(_reviewWasRevealed) revealCard();   // restore the answer view they were on
  return true;
}
$("#cancelEdit").onclick = ()=>{ if(returnToReviewIfNeeded()) return; resetForm(); showTab("list"); };
$("#saveCard").onclick = ()=>{
  const thai=$("#fThai").value.trim();
  const meaning=$("#fMean").value.trim();
  // Only the Thai word is required — a card can be defined by its examples, and the
  // meaning can be added later. When it IS missing, the message must be impossible
  // to miss (the field is at the top, the button at the bottom): toast + scroll +
  // a red highlight on the field itself.
  if(!thai){
    const el = $("#fThai");
    $("#addMsg").textContent = "请先填写最上面的『泰文单词』";
    toast("请先填写『泰文单词』");
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    el.classList.add("field-missing");
    setTimeout(()=>el.focus(), 320);
    setTimeout(()=>el.classList.remove("field-missing"), 2200);
    return;
  }
  $("#addMsg").textContent = "";
  const data={
    thai, meaning,
    reading:$("#fRead").value.trim(),
    note:$("#fNote").value.trim(),
    examples: collectExamples(),
  };
  if(editingId){
    const c=cards.find(x=>x.id===editingId);
    Object.assign(c,data); save();
    toast("已更新");
    if(returnToReviewIfNeeded()) return;
    resetForm(); showTab("list");
  }else{
    cards.push({ id:uid(), day:todayStr(), createdAt:Date.now(), ...data });
    save();
    toast("已添加 ✓"); resetForm();
    $("#fThai").focus();
    renderHome();
  }
};
$("#fThaiSpk").onclick = ()=> speak($("#fThai").value.trim());

/* ---------------- REVIEW ENGINE ---------------- */
let queue = [];        // remaining cards this session (current = queue[0])
let sessionTotal = 0;  // cards at session start
let revealed = false;
const tally = { again:0, hard:0, good:0, easy:0 };

// ---- resume an unfinished review session across app restarts ----
const SESSION_KEY = "thaicards.session.v1";
// snapshot the live queue (as card ids), progress total and tally so we can
// pick the session back up exactly where it was left — even after the app
// is fully closed
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      ids: queue.map(c=>c.id),
      sessionTotal, tally, ts: Date.now()
    }));
  }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
// return a usable saved session, or null (dropping ids of deleted cards)
function loadSavedSession(){
  let s; try{ s = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
  if(!s || !Array.isArray(s.ids)) return null;
  const live = s.ids.map(id=>cards.find(c=>c.id===id)).filter(Boolean);
  if(live.length===0){ clearSession(); return null; }
  return { list: live, sessionTotal: s.sessionTotal||live.length, tally: s.tally||{again:0,hard:0,good:0,easy:0} };
}
function continueReview(){
  const s = loadSavedSession();
  if(!s){ refreshContinueCta(); return; }
  queue = s.list;
  sessionTotal = s.sessionTotal;
  tally.again=s.tally.again||0; tally.hard=s.tally.hard||0; tally.good=s.tally.good||0; tally.easy=s.tally.easy||0;
  revealed=false;
  $("#rvDone").style.display="none";
  $("#rvActive").style.display="flex";
  $("#reviewScreen").classList.add("active");
  renderReviewCard();
}
// show/hide the home "继续上次复习" button based on whether a session is saved
function refreshContinueCta(){
  const btn = $("#continueReview"); if(!btn) return;
  const s = loadSavedSession();
  if(s){ $("#contRemain").textContent = s.list.length; btn.style.display="flex"; }
  else { btn.style.display="none"; }
}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startReview(){
  if(cards.length===0) return;
  queue = shuffle(cards);
  // if the user picked a word on the home list, start the session from it
  if(homeUserPicked && homeCardId){
    const i = queue.findIndex(c=>c.id===homeCardId);
    if(i>=0) queue.unshift(queue.splice(i,1)[0]);
  }
  sessionTotal = queue.length;
  tally.again=tally.hard=tally.good=tally.easy=0;
  revealed=false;
  $("#rvDone").style.display="none";
  $("#rvActive").style.display="flex";
  $("#reviewScreen").classList.add("active");
  clearSession();          // a fresh session replaces any leftover one
  renderReviewCard();
}
function renderReviewCard(){
  const c = queue[0];
  if(!c){ endSession(); return; }
  saveSession();           // persist progress so we can resume after a restart
  $("#cardThai").textContent = c.thai;
  $("#cbMean").textContent = c.meaning || "";
  $("#cbRead").textContent = c.reading || "";
  renderNote($("#cbNote"), c.note);
  renderCardExamples($("#cbExList"), c.examples || [], c.id);
  // reset to front
  revealed=false;
  $("#cardBack").classList.remove("show");
  $("#tapHint").style.display="block";
  $("#revealBtn").classList.remove("hide");
  $("#rvActions").classList.remove("show");
  updateProgress();
  updateNavButtons();
}
function revealCard(){
  if(revealed) return;
  revealed=true;
  $("#cardBack").classList.add("show");
  $("#tapHint").style.display="none";
  $("#revealBtn").classList.add("hide");
  $("#rvActions").classList.add("show");
}
// wrap any highlighted sub-strings of an example in <mark>, then alternate two
// colors by their order in the sentence so two adjacent highlights (common in
// spaceless Thai) don't merge into one blob
function hlThai(thai, hlList){
  let html = esc(thai);
  (hlList||[]).forEach(w=>{
    if(!w) return;
    const e = esc(w);
    html = html.split(e).join('<mark class="hl">'+e+'</mark>');
  });
  let i = 0;
  html = html.replace(/<mark class="hl">/g, () => '<mark class="hl ' + (i++ % 2 ? 'hl-b' : 'hl-a') + '">');
  return html;
}
// show the 备注 block only when the card has a note
function renderNote(box, note){
  if(!box) return;
  const s = (note || "").trim();
  box.textContent = s;
  box.style.display = s ? "block" : "none";
}
function renderCardExamples(box, list, cardId){
  box.innerHTML = "";
  (list||[]).forEach((e,idx)=>{
    if(!e || !e.thai) return;
    const el = document.createElement("div");
    el.className = "cb-ex";
    if(cardId!=null){ el.dataset.card = cardId; el.dataset.ex = idx; }
    el.innerHTML = `<div class="ex-thai thai"><span>${hlThai(e.thai, e.hl)}</span><button class="mini spk" aria-label="例句发音">🔊</button></div>` +
      (e.meaning ? `<div class="ex-mean">${esc(e.meaning)}</div>` : "");
    el.querySelector(".spk").onclick = ev=>{ ev.stopPropagation(); speak(e.thai); };
    box.appendChild(el);
  });
}
function updateProgress(){
  const remaining = queue.length;
  const done = sessionTotal - remaining;
  const pct = sessionTotal ? Math.round(done/sessionTotal*100) : 0;
  $("#rvRemain").textContent = remaining;
  $("#rvTotal").textContent = sessionTotal;
  $("#rvBar").style.width = pct+"%";
  $("#rvPct").textContent = pct+"%";
  $("#tAgain").textContent = tally.again;
  $("#tHard").textContent = tally.hard;
  $("#tGood").textContent = tally.good;
  $("#tEasy").textContent = tally.easy;
}
function rate(kind){
  if(!revealed) return;              // must see answer first
  if(queue.length===0) return;
  tally[kind]++;
  const cur = queue.shift();         // remove current from front; queue = remaining
  if(kind==="again"){
    // insert into the 2nd position of remaining cards
    queue.splice(Math.min(1, queue.length), 0, cur);
  }else if(kind==="hard"){
    // insert into the middle of remaining cards
    queue.splice(Math.floor(queue.length/2), 0, cur);
  }else if(kind==="good"){
    // move to the very end
    queue.push(cur);
  } // easy: dropped from this session
  if(queue.length===0){ endSession(); return; }
  renderReviewCard();
}
// 浏览：轮转当前复习队列，不评分、不改剩余数
function nextCard(){ if(queue.length>1){ queue.push(queue.shift()); renderReviewCard(); } }
function prevCard(){ if(queue.length>1){ queue.unshift(queue.pop()); renderReviewCard(); } }
function updateNavButtons(){
  const dis = queue.length<=1;
  const pb=$("#prevBtn"), nb=$("#nextBtn");
  if(pb) pb.disabled=dis; if(nb) nb.disabled=dis;
}
function endSession(){
  clearSession();          // finished — nothing left to resume
  $("#rvActive").style.display="none";
  $("#rvDone").style.display="block";
  $("#dAgain").textContent=tally.again;
  $("#dHard").textContent=tally.hard;
  $("#dGood").textContent=tally.good;
  $("#dEasy").textContent=tally.easy;
  const total = tally.again+tally.hard+tally.good+tally.easy;
  $("#doneSub").textContent = `共 ${total} 次评分 · ${sessionTotal} 张卡片`;
}
function closeReview(){
  editReturnToReview = false;
  $("#reviewScreen").classList.remove("active");
  speechSynthesis.cancel();
  refreshContinueCta();    // exiting mid-session → offer to resume it later
  showTab("home");
  if(window.applyPendingUpdate) window.applyPendingUpdate();   // update now if one arrived mid-review
}
$("#startReview").onclick = startReview;
$("#continueReview").onclick = continueReview;
$("#rvClose").onclick = closeReview;
// edit the card currently under review (e.g. to add an example), then come back
$("#rvEdit").onclick = ()=>{
  const c = queue[0]; if(!c) return;
  editReturnToReview = true;
  _reviewWasRevealed = revealed;
  $("#reviewScreen").classList.remove("active");
  startEdit(c.id);
};
$("#doneClose").onclick = closeReview;
$("#reviewCard").onclick = e=>{ if(e.target.closest("button")) return; if(!revealed) revealCard(); };
$("#revealBtn").onclick = revealCard;
$("#cardSpk").onclick = e=>{ e.stopPropagation(); speak(queue[0]?.thai); };
$("#rvActions").querySelectorAll(".rate").forEach(b=> b.onclick=()=>rate(b.dataset.k));
$("#prevBtn").onclick = prevCard;
$("#nextBtn").onclick = nextCard;
// keyboard shortcuts (desktop)
document.addEventListener("keydown", e=>{
  if(!$("#reviewScreen").classList.contains("active")) return;
  if($("#rvActive").style.display==="none") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!revealed) revealCard(); return; }
  if(!revealed) return;
  const map={"1":"again","2":"hard","3":"good","4":"easy"};
  if(map[e.key]) rate(map[e.key]);
});

$("#importFile").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      let added=0;
      data.forEach(d=>{
        if(!d.thai) return;
        d.id = d.id || uid();
        if(!Array.isArray(d.examples)){
          d.examples = d.example ? [{thai:d.example, meaning:d.exampleMeaning||""}] : [];
        }
        delete d.example; delete d.exampleMeaning;
        if(!cards.some(c=>c.id===d.id || (c.thai===d.thai && c.meaning===d.meaning))){
          cards.push({day:todayStr(),createdAt:Date.now(),...d});
          added++;
        }
      });
      save(); renderHome(); renderList();
      toast(`导入 ${added} 张新卡片`);
      openSheet(false);
    }catch(err){ toast("文件格式不正确"); }
  };
  r.readAsText(f);
  e.target.value="";
};

/* ---------------- util ---------------- */
function esc(s){ return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ---------------- cloud sync (shares 随手记's login + /api/sync) ---------------- */
// Thai cards ride in the same {notes,cats,thai} blob as the notes app, using a
// monotonic rev (last-write-wins). The server only overwrites `thai` when the
// incoming rev is >= the stored one, and the notes/cats fields are left untouched
// because we PUT only { thai, thaiRev } — so pushing here never clobbers notes.
const REV_KEY = "thaicards.rev";
const CLOUD_KEY = "quicknotes.cloud";
function getCloud(){
  try{ const c = JSON.parse(localStorage.getItem(CLOUD_KEY)); return (c && c.token && c.url) ? c : null; }
  catch(e){ return null; }
}
function getThaiRev(){ return parseInt(localStorage.getItem(REV_KEY),10) || 0; }
function bumpThaiRev(){ const r = Date.now(); localStorage.setItem(REV_KEY, String(r)); return r; }

let _pushTimer = null;
function scheduleThaiPush(){
  if(!getCloud()) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(thaiPush, 800);   // debounce rapid edits
}
async function thaiPush(){
  const cloud = getCloud(); if(!cloud) return;
  try{
    // Echo the server's current notes/cats back untouched. On the updated
    // server this is redundant (it does partial upserts), but it keeps us safe
    // against an older server that overwrites every field — so pushing only the
    // Thai section can never wipe the user's notes.
    let cur = {};
    try{ const g = await fetch(`${cloud.url}/api/sync`, { headers:{ "Authorization":"Bearer "+cloud.token } }); if(g.ok) cur = await g.json(); }catch(e){}
    const body = { thai: cards, thaiRev: getThaiRev() };
    if(Array.isArray(cur.notes)) body.notes = cur.notes;
    if(Array.isArray(cur.cats))  body.cats  = cur.cats;
    await fetch(`${cloud.url}/api/sync`, {
      method:"PUT",
      headers:{ "Authorization":"Bearer "+cloud.token, "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
async function thaiPull(){
  const cloud = getCloud(); if(!cloud) return;
  try{
    const res = await fetch(`${cloud.url}/api/sync`, { headers:{ "Authorization":"Bearer "+cloud.token } });
    if(!res.ok) return;
    const data = await res.json();
    if(Array.isArray(data.thai) && (data.thaiRev||0) > getThaiRev()){
      cards = data.thai;
      localStorage.setItem(STORE_KEY, JSON.stringify(cards));
      localStorage.setItem(REV_KEY, String(data.thaiRev||0));
      renderHome();
      if(document.querySelector("#view-list.active")) renderList();
    }
  }catch(e){}
}
async function thaiSync(){
  if(!getCloud()) return;
  await thaiPull();   // adopt server if it's newer
  thaiPush();         // converge (server rev-gates, so a stale push is a no-op)
}

/* ---------- select a word in an example -> highlight / add to vocab ---------- */
let selCtx = null;   // { text, cbEx }
function hideSelPop(){ $("#selPop").classList.remove("show"); selCtx=null; }
function onSelChange(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ hideSelPop(); return; }
  const text = sel.toString().trim();
  if(!text){ hideSelPop(); return; }
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if(node.nodeType===3) node = node.parentElement;
  const exThai = node && node.closest ? node.closest(".ex-thai") : null;
  if(!exThai){ hideSelPop(); return; }
  const cbEx = exThai.closest(".cb-ex");
  selCtx = { text, cbEx };
  // if the selected word is itself a headword in the vocab book (and not the
  // very card that owns this example), offer a "peek at that word" button
  const ownId = cbEx ? cbEx.dataset.card : null;
  const match = findCardByThai(text);
  selCtx.match = (match && match.id !== ownId) ? match : null;
  $("#selPeek").style.display = selCtx.match ? "flex" : "none";
  $("#selPop").classList.add("show");   // fixed position via CSS (bottom-centered)
}
function findCardByThai(text){
  const t = (text||"").trim();
  if(!t) return null;
  return cards.find(c => (c.thai||"").trim() === t) || null;
}
// read-only peek at a vocab card, layered over the review (queue untouched)
function openPeek(card){
  if(!card) return;
  $("#peekThai").textContent = card.thai || "—";
  $("#peekMean").textContent = card.meaning || "";
  $("#peekRead").textContent = card.reading || "";
  renderNote($("#peekNote"), card.note);
  renderCardExamples($("#peekExList"), card.examples || [], card.id);
  $("#peekBg").classList.add("show");
  $("#peekPanel").classList.add("show");
}
function closePeek(){
  $("#peekBg").classList.remove("show");
  $("#peekPanel").classList.remove("show");
  hideSelPop();
  const s = window.getSelection && window.getSelection(); if(s) s.removeAllRanges();
  speechSynthesis.cancel();
}
$("#peekBg").onclick = closePeek;
$("#peekClose").onclick = closePeek;
// tapping the dark area around the card also closes (peekPanel covers peekBg)
$("#peekPanel").onclick = e=>{ if(e.target.id === "peekPanel") closePeek(); };
$("#peekSpk").onclick = e=>{ e.stopPropagation(); const t=$("#peekThai").textContent; if(t && t!=="—") speak(t); };
document.addEventListener("selectionchange", ()=>{ clearTimeout(window._selT); window._selT = setTimeout(onSelChange, 180); });
document.addEventListener("scroll", hideSelPop, true);
function toggleHighlight(cbEx, text){
  if(!cbEx) return;
  const card = cards.find(c=>c.id===cbEx.dataset.card);
  const idx = parseInt(cbEx.dataset.ex, 10);
  if(!card || !card.examples || !card.examples[idx]) return;
  const ex = card.examples[idx];
  ex.hl = ex.hl || [];
  const i = ex.hl.indexOf(text);
  if(i>=0) ex.hl.splice(i,1); else ex.hl.push(text);
  if(!ex.hl.length) delete ex.hl;
  save();
  renderCardExamples(cbEx.closest(".cb-exlist"), card.examples, card.id);
}
$("#selSpeak").onclick = ()=>{ if(selCtx) speak(selCtx.text); };
$("#selHl").onclick = ()=>{ if(selCtx) toggleHighlight(selCtx.cbEx, selCtx.text); hideSelPop(); const s=window.getSelection&&window.getSelection(); if(s) s.removeAllRanges(); };
$("#selAdd").onclick = ()=>{ if(selCtx) openAddWord(selCtx.text); hideSelPop(); };
$("#selPeek").onclick = ()=>{ const m = selCtx && selCtx.match; hideSelPop(); const s=window.getSelection&&window.getSelection(); if(s) s.removeAllRanges(); if(m) openPeek(m); };

/* ---------- add selected word as a new vocab card ---------- */
function openAddWord(thai){
  $("#awThai").value = thai;
  $("#awMean").value = ""; $("#awRead").value = "";
  $("#awExList").innerHTML = "";   // examples optional; start empty
  $("#addWordBg").classList.add("show");
  $("#addWordSheet").classList.add("show");
  $("#addWordSheet").scrollTop = 0;
  setTimeout(()=>$("#awMean").focus(), 120);
}
function closeAddWord(){ $("#addWordBg").classList.remove("show"); $("#addWordSheet").classList.remove("show"); }
$("#awCancel").onclick = closeAddWord;
$("#addWordBg").onclick = closeAddWord;
$("#awAddEx").onclick = ()=> addExRow("", "", $("#awExList"));
$("#awSave").onclick = ()=>{
  const thai = $("#awThai").value.trim(); if(!thai){ closeAddWord(); return; }
  cards.push({ id:uid(), day:todayStr(), createdAt:Date.now(), thai, meaning:$("#awMean").value.trim(), reading:$("#awRead").value.trim(), examples:collectExamples($("#awExList")) });
  save();
  closeAddWord();
  toast("已加入生词：" + thai);
  if(document.querySelector("#view-home.active")) renderHome();
};

/* ---------------- boot ---------------- */
const _av = document.getElementById("appVer"); if(_av) _av.textContent = APP_VER;
load();
renderHome();
thaiSync();
setInterval(thaiPull, 20000);   // keep in step with the notes app's 20s cadence
/* ---------------- auto-update ----------------
   Two paths so an update always lands: (1) the service worker's controllerchange,
   and (2) a version poll that fetches the live page (cache-busted) and compares
   APP_VER — reliable on iOS, where a resumed PWA never re-navigates and the SW may
   not re-check. Either way, reloads are deferred while a review is running (the
   session is saved regardless) so a card is never yanked away mid-review. */
let _updatePending = false, _didReload = false;
function _applyUpdate(){
  if(_didReload) return;
  _didReload = true;
  try{ toast("正在更新到新版…"); }catch(e){}
  setTimeout(()=>location.reload(), 600);
}
function _reloadWhenSafe(){
  const rs = document.getElementById("reviewScreen");
  if(rs && rs.classList.contains("active")){
    _updatePending = true;
    try{ toast("新版本已就绪 · 复习结束后自动更新"); }catch(e){}
  }else{
    _applyUpdate();
  }
}
// called from closeReview() to apply an update that arrived mid-review
window.applyPendingUpdate = ()=>{ if(_updatePending) _applyUpdate(); };
let _checking = false;
async function checkForUpdate(){
  if(_checking || _didReload) return; _checking = true;
  try{
    const r = await fetch("./index.html?u=" + Date.now(), { cache:"no-store" });
    if(r.ok){
      const t = await r.text();
      const m = t.match(/APP_VER\s*=\s*"([^"]+)"/);
      if(m && m[1] && m[1] !== APP_VER) _reloadWhenSafe();
    }
  }catch(e){}
  finally{ _checking = false; }
}
if("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController) _reloadWhenSafe(); });
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").then(reg=>{ reg.update().catch(()=>{}); }).catch(()=>{}); });
}
window.addEventListener("load", checkForUpdate);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkForUpdate(); });
setInterval(checkForUpdate, 30*60*1000);
</script>
